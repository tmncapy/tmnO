<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
    <title>Bảng Điểm Thí Sinh 1</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Exact PowerPoint 16:9 Slide (13.3333" x 7.5" -> 1920px x 1080px, 1" = 144px, 1pt = 2px) */
        .scoreboard-container {
            position: relative;
            width: 1920px;
            height: 1080px;
            flex-shrink: 0;
            transform-origin: center center;
            background-image: url('Media/ScoreBoard.png');
            background-size: 1920px 1080px;
            background-repeat: no-repeat;
            background-position: center;
            font-family: Verdana, Geneva, Tahoma, sans-serif;
            overflow: hidden;
        }

        .scoreboard-bg {
            position: absolute;
            left: 0;
            top: 0;
            width: 1920px;
            height: 1080px;
            object-fit: fill;
            z-index: 1;
            pointer-events: none;
        }

        /* Tên: 1.51 x 13.33, 0 x 0 (PPT), font Verdana, RGB(0, 32, 96), 66pt -> 217.44px x 1919.52px, 0 x 0, 132px */
        .name {
            position: absolute;
            top: 0px;
            left: 0px;
            width: 1919.52px;
            height: 217.44px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 36px 4px 36px;
            font-family: Verdana, Geneva, Tahoma, sans-serif;
            font-size: 132px;
            font-weight: bold;
            color: rgb(0, 32, 96);
            line-height: 1.35;
            text-align: center;
            white-space: nowrap;
            overflow: visible;
            z-index: 60;
        }

        .name-text {
            display: inline-block;
            flex: 0 0 auto;
            transform-origin: center center;
        }

        /* Điểm: 5.99 x 13.33, 0 x 1.51 (PPT), font Verdana, RGB(255, 255, 255), 287pt -> 862.56px x 1919.52px, 0 x 217.44px, 574px */
        .score {
            position: absolute;
            top: 217.44px;
            left: 0px;
            width: 1919.52px;
            height: 862.56px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 36px;
            font-family: Verdana, Geneva, Tahoma, sans-serif;
            font-size: 574px;
            font-weight: bold;
            color: rgb(255, 255, 255);
            line-height: 1.15;
            text-align: center;
            font-variant-numeric: tabular-nums;
            white-space: nowrap;
            overflow: visible;
            z-index: 60;
        }

        .score-text {
            display: inline-block;
            flex: 0 0 auto;
            transform-origin: center center;
        }

        /* Info Scene (Media/Info.png) */
        .scoreboard-info-scene {
            position: absolute;
            top: 0;
            left: 0;
            width: 1920px;
            height: 1080px;
            z-index: 80;
            display: none;
            overflow: hidden;
        }

        .scoreboard-info-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 1920px;
            height: 1080px;
            object-fit: fill;
            z-index: 1;
            pointer-events: none;
        }

        /* Info Tên: 2.05 x 11.03, 1.15 x 1.7 (PPT), Verdana, RGB(255, 255, 255), 88pt -> 295.20px x 1588.32px, 165.60px x 244.80px, 176px */
        .info-name {
            position: absolute;
            left: 165.60px;
            top: 244.80px;
            width: 1588.32px;
            height: 295.20px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 36px 4px 36px;
            font-family: Verdana, Geneva, Tahoma, sans-serif;
            font-size: 176px;
            font-weight: bold;
            color: rgb(255, 255, 255);
            line-height: 1.35;
            text-align: center;
            white-space: nowrap;
            overflow: visible;
            z-index: 20;
        }

        .info-name-text {
            display: inline-block;
            flex: 0 0 auto;
            transform-origin: center center;
        }

        /* Info Detail: 2.05 x 11.03, 1.15 x 3.75 (PPT), Verdana, RGB(255, 255, 255), 48pt -> 295.20px x 1588.32px, 165.60px x 540.00px, 96px */
        .info-detail {
            position: absolute;
            left: 165.60px;
            top: 540.00px;
            width: 1588.32px;
            height: 295.20px;
            display: flex;
            align-items: safe center;
            justify-content: center;
            padding: 0 24px 6px 24px;
            font-family: Verdana, Geneva, Tahoma, sans-serif;
            font-size: 96px;
            font-weight: bold;
            color: rgb(255, 255, 255);
            line-height: 1.25;
            text-align: center;
            white-space: pre-wrap;
            word-break: break-word;
            overflow: hidden;
            z-index: 20;
        }

        .info-detail-text {
            width: 100%;
            text-align: center;
            padding-bottom: 4px;
            overflow: visible;
        }
    </style>
</head>
<body>

    <div class="scoreboard-container" id="stage-wrapper">
        <img class="scoreboard-bg" src="Media/ScoreBoard.png" alt="">
        <div id="orange_flash_overlay" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(255, 165, 0, 0.7); pointer-events: none; z-index: 999; opacity: 0; transition: opacity 0.1s ease;"></div>
        <img id="scoreboard_thumbnail_img" src="Media/thumbnail.png" alt="Thumbnail" onerror="this.style.display='none'" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: fill; z-index: 100; display: none;">
        <div class="name" id="contestant_name_box"><span class="name-text" id="contestant_name">THÍ SINH 1</span></div>
        <div class="score" id="contestant_score_box"><span class="score-text" id="contestant_score">0</span></div>
        <div class="scoreboard-info-scene" id="scoreboard_info_scene">
            <img class="scoreboard-info-bg" src="Media/Info.png" alt="">
            <div class="info-name" id="info_name_box"><span class="info-name-text" id="info_name">THÍ SINH 1</span></div>
            <div class="info-detail" id="info_detail_box"><div class="info-detail-text" id="info_detail"></div></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-sync.js"></script>
    <script>
        const CONTESTANT_ID = 1;
        const scoreEl = document.getElementById('contestant_score');
        const scoreBoxEl = document.getElementById('contestant_score_box');
        const nameEl = document.getElementById('contestant_name');
        const nameBoxEl = document.getElementById('contestant_name_box');
        const infoSceneEl = document.getElementById('scoreboard_info_scene');
        const infoNameEl = document.getElementById('info_name');
        const infoNameBoxEl = document.getElementById('info_name_box');
        const infoDetailEl = document.getElementById('info_detail');
        const infoDetailBoxEl = document.getElementById('info_detail_box');

        function scaleStage() {
            const stage = document.getElementById('stage-wrapper');
            if (!stage) return;
            const scale = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
            stage.style.transform = `scale(${scale})`;
        }
        window.addEventListener('resize', scaleStage);
        window.addEventListener('DOMContentLoaded', scaleStage);
        scaleStage();

        function fitSingleLine(boxEl, textEl) {
            if (!boxEl || !textEl) return;
            textEl.style.transform = 'none';
            const cs = window.getComputedStyle(boxEl);
            const padLeft = parseFloat(cs.paddingLeft) || 0;
            const padRight = parseFloat(cs.paddingRight) || 0;
            const maxWidth = Math.max(100, boxEl.clientWidth - padLeft - padRight);
            const textWidth = Math.max(textEl.offsetWidth || 0, textEl.scrollWidth || 0);
            if (textWidth > maxWidth && textWidth > 0) {
                textEl.style.transform = `scaleX(${maxWidth / textWidth})`;
            }
        }

        function fitInfoDetail() {
            if (!infoDetailBoxEl || !infoDetailEl) return;
            let size = 96;
            infoDetailBoxEl.style.fontSize = size + 'px';
            while (infoDetailBoxEl.scrollHeight > infoDetailBoxEl.clientHeight && size > 24) {
                size -= 4;
                infoDetailBoxEl.style.fontSize = size + 'px';
            }
        }

        function fitNameText() {
            fitSingleLine(nameBoxEl, nameEl);
            fitSingleLine(scoreBoxEl, scoreEl);
            fitSingleLine(infoNameBoxEl, infoNameEl);
            fitInfoDetail();
        }
        window.addEventListener('resize', fitNameText);
        window.addEventListener('load', fitNameText);

        function updateScoreboard(name, score, info) {
            if (score !== undefined && score !== null && !isNaN(score)) {
                scoreEl.innerText = score;
            }
            if (name !== undefined && name !== null && name.toString().trim() !== '') {
                const displayName = name.toString();
                nameEl.innerText = displayName;
                if (infoNameEl) infoNameEl.innerText = displayName;
            }
            if (info !== undefined && info !== null && infoDetailEl) {
                infoDetailEl.innerText = info.toString();
            }
            fitNameText();
        }

        function setInfoSceneVisible(show) {
            if (!infoSceneEl) return;
            infoSceneEl.style.display = show ? 'block' : 'none';
            if (show) fitNameText();
        }

        function loadInitialData() {
            try {
                const savedSelf = localStorage.getItem('ddvq_scoreboard_thumbnail_shown_' + CONTESTANT_ID);
                const savedAll = localStorage.getItem('ddvq_scoreboard_thumbnail_shown');
                const thumbEl = document.getElementById('scoreboard_thumbnail_img');
                if (thumbEl) {
                    if (savedSelf === 'true' || (savedSelf === null && savedAll === 'true')) {
                        thumbEl.style.display = 'block';
                    } else if (savedSelf === 'false') {
                        thumbEl.style.display = 'none';
                    }
                }
            } catch(e) {}

            try {
                const savedInfoSelf = localStorage.getItem('ddvq_scoreboard_info_shown_' + CONTESTANT_ID);
                const savedInfoAll = localStorage.getItem('ddvq_scoreboard_info_shown');
                if (savedInfoSelf === 'true' || (savedInfoSelf === null && savedInfoAll === 'true')) {
                    setInfoSceneVisible(true);
                } else if (savedInfoSelf === 'false') {
                    setInfoSceneVisible(false);
                }
            } catch(e) {}

            try {
                const saved = localStorage.getItem('ddvq_contestants');
                if (saved) {
                    const list = JSON.parse(saved);
                    if (list && list[CONTESTANT_ID - 1]) {
                        updateScoreboard(list[CONTESTANT_ID - 1].name, list[CONTESTANT_ID - 1].score, list[CONTESTANT_ID - 1].info);
                    }
                }
            } catch(e) {}

            try {
                const gDataStr = localStorage.getItem('duong_den_vinh_quang_data');
                if (gDataStr) {
                    const gData = JSON.parse(gDataStr);
                    if (gData && gData.contestants && gData.contestants[CONTESTANT_ID - 1]) {
                        updateScoreboard(gData.contestants[CONTESTANT_ID - 1].name, gData.contestants[CONTESTANT_ID - 1].score, gData.contestants[CONTESTANT_ID - 1].info);
                    }
                }
            } catch(e) {}

            const stateUrl = typeof window.getApiUrl === 'function' ? window.getApiUrl('/api/state') : '/api/state';
            fetch(stateUrl)
                .then(res => res.json())
                .then(data => handleData(data))
                .catch(() => {});
        }

        let flashInterval = null;
        function triggerOrangeFlash() {
            const overlay = document.getElementById('orange_flash_overlay');
            if (!overlay) return;
            if (flashInterval) clearInterval(flashInterval);

            let count = 0;
            const maxFlashes = 10;
            let isOn = false;

            flashInterval = setInterval(() => {
                isOn = !isOn;
                overlay.style.opacity = isOn ? '1' : '0';
                if (isOn) {
                    count++;
                    if (count >= maxFlashes) {
                        setTimeout(() => {
                            clearInterval(flashInterval);
                            flashInterval = null;
                            overlay.style.opacity = '0';
                        }, 250);
                    }
                }
            }, 250);

            isOn = true;
            overlay.style.opacity = '1';
            count = 1;
        }

        function handleData(data) {
            if (!data) return;

            if (data.type === 'TOGGLE_SCOREBOARD_THUMBNAIL' || data.type === 'SHOW_SCOREBOARD_THUMBNAIL' || data.type === 'HIDE_SCOREBOARD_THUMBNAIL') {
                const thumbEl = document.getElementById('scoreboard_thumbnail_img');
                if (thumbEl) {
                    const targetId = data.contestantId || data.targetSlot || 'ALL';
                    if (targetId === 'ALL' || parseInt(targetId) === CONTESTANT_ID) {
                        let show = false;
                        if (data.type === 'SHOW_SCOREBOARD_THUMBNAIL') show = true;
                        else if (data.type === 'HIDE_SCOREBOARD_THUMBNAIL') show = false;
                        else show = data.show !== undefined ? data.show : (thumbEl.style.display === 'none' || !thumbEl.style.display);
                        thumbEl.style.display = show ? 'block' : 'none';
                        try { localStorage.setItem('ddvq_scoreboard_thumbnail_shown_' + CONTESTANT_ID, show ? 'true' : 'false'); } catch(e){}
                    }
                }
            } else if (data.scoreboardThumbnailStates && data.scoreboardThumbnailStates[CONTESTANT_ID] !== undefined) {
                const thumbEl = document.getElementById('scoreboard_thumbnail_img');
                if (thumbEl) {
                    const show = !!data.scoreboardThumbnailStates[CONTESTANT_ID];
                    thumbEl.style.display = show ? 'block' : 'none';
                    try { localStorage.setItem('ddvq_scoreboard_thumbnail_shown_' + CONTESTANT_ID, show ? 'true' : 'false'); } catch(e){}
                }
            }

            if (data.type === 'TOGGLE_SCOREBOARD_INFO' || data.type === 'SHOW_SCOREBOARD_INFO' || data.type === 'HIDE_SCOREBOARD_INFO') {
                if (infoSceneEl) {
                    const targetId = data.contestantId || data.targetSlot || 'ALL';
                    if (targetId === 'ALL' || parseInt(targetId) === CONTESTANT_ID) {
                        let show = false;
                        if (data.type === 'SHOW_SCOREBOARD_INFO') show = true;
                        else if (data.type === 'HIDE_SCOREBOARD_INFO') show = false;
                        else show = data.show !== undefined ? data.show : (infoSceneEl.style.display === 'none' || !infoSceneEl.style.display);
                        setInfoSceneVisible(show);
                        try { localStorage.setItem('ddvq_scoreboard_info_shown_' + CONTESTANT_ID, show ? 'true' : 'false'); } catch(e){}
                    }
                }
            } else if (data.scoreboardInfoStates && data.scoreboardInfoStates[CONTESTANT_ID] !== undefined) {
                const show = !!data.scoreboardInfoStates[CONTESTANT_ID];
                setInfoSceneVisible(show);
                try { localStorage.setItem('ddvq_scoreboard_info_shown_' + CONTESTANT_ID, show ? 'true' : 'false'); } catch(e){}
            }

            if (
                data.type === 'S3_FLASH_SCOREBOARD' ||
                (data.type === 'PLAYER_RING_BELL' && (data.round === 'VUOT_SONG' || data.round === 'VS' || data.round === 'VCNV')) ||
                (data.type === 'PLAYER_SUBMIT_ANSWER' && (data.round === 'VS' || data.round === 'VUOT_SONG') && (data.isVongThi === true || (data.answer && data.answer.startsWith('[CNV]'))))
            ) {
                const targetC = data.contestantId;
                if (!targetC || parseInt(targetC) === CONTESTANT_ID) {
                    triggerOrangeFlash();
                }
            }

            if (data.contestants && Array.isArray(data.contestants)) {
                const myData = data.contestants[CONTESTANT_ID - 1];
                if (myData) {
                    updateScoreboard(myData.name, myData.score, myData.info);
                }
            }

            if (data.gameData && data.gameData.contestants && Array.isArray(data.gameData.contestants)) {
                const myData = data.gameData.contestants[CONTESTANT_ID - 1];
                if (myData) {
                    updateScoreboard(myData.name, myData.score, myData.info);
                }
            }

            if (data.type === 'XUAT_PHAT_SELECT_CONTESTANT' && data.turnIndex === CONTESTANT_ID) {
                updateScoreboard(data.name, data.score, data.info);
            }

            if (data.latestAction && typeof data.latestAction === 'object') {
                handleData(data.latestAction);
            }
        }

        // BroadcastChannel
        try {
            if (typeof BroadcastChannel !== 'undefined') {
                const channel = new BroadcastChannel('ddvq_game_channel');
                channel.onmessage = function(e) {
                    handleData(e.data);
                };
            }
        } catch(e) {}

        // Server-Sent Events (SSE)
        if (typeof EventSource !== 'undefined') {
            try {
                const sseUrl = typeof window.getApiUrl === 'function' ? window.getApiUrl('/api/events') : '/api/events';
                const sse = new EventSource(sseUrl);
                sse.onmessage = function(e) {
                    try {
                        const data = JSON.parse(e.data);
                        handleData(data);
                    } catch(err) {}
                };
            } catch(e) {}
        }

        // Window storage listener
        window.addEventListener('storage', function(e) {
            if (e.key === 'ddvq_latest_action' && e.newValue) {
                try {
                    handleData(JSON.parse(e.newValue));
                } catch(err) {}
            } else if (e.key === 'ddvq_contestants' && e.newValue) {
                try {
                    const list = JSON.parse(e.newValue);
                    if (list && list[CONTESTANT_ID - 1]) {
                        updateScoreboard(list[CONTESTANT_ID - 1].name, list[CONTESTANT_ID - 1].score, list[CONTESTANT_ID - 1].info);
                    }
                } catch(err) {}
            } else if (e.key === 'duong_den_vinh_quang_data' && e.newValue) {
                try {
                    const gData = JSON.parse(e.newValue);
                    if (gData && gData.contestants && gData.contestants[CONTESTANT_ID - 1]) {
                        updateScoreboard(gData.contestants[CONTESTANT_ID - 1].name, gData.contestants[CONTESTANT_ID - 1].score, gData.contestants[CONTESTANT_ID - 1].info);
                    }
                } catch(err) {}
            }
        });

        // Window postMessage listener
        window.addEventListener('message', function(e) {
            if (e.data) handleData(e.data);
        });

        // Initial fetch
        loadInitialData();

        // Polling fallback
        setInterval(() => {
            loadInitialData();
        }, 1500);
    </script>
</body>
</html>
