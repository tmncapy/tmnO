    <script>
        window.CURRENT_ROLE = 'projector';

        // Viewport scaling (1920x1080 aspect-fit)
        function scaleStage() {
            const stage = document.getElementById('stage-wrapper');
            if (!stage) return;
            const scale = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
            stage.style.transform = `scale(${scale})`;
        }
        window.addEventListener('resize', scaleStage);
        window.addEventListener('DOMContentLoaded', scaleStage);
        scaleStage();

        // Audio Settings
        const audioSettings = {
            enabled: true,
            volume: 1.0
        };

        try {
            const savedAudio = localStorage.getItem('ddvq_audio_settings');
            if (savedAudio) {
                const parsed = JSON.parse(savedAudio);
                if (typeof parsed.projectorEnabled === 'boolean') audioSettings.enabled = parsed.projectorEnabled;
                if (typeof parsed.projectorVolume === 'number') audioSettings.volume = Math.max(0, Math.min(1, parsed.projectorVolume / 100));
            }
        } catch (e) {}

        // Preload Round 1 & Round 2 SFX
        const SFX_PATHS = {
            startRound: '/SFX/1_StartRound.mp3',
            pStart: '/SFX/1_PStart.mp3',
            showQues: '/SFX/1_StartStartQuestionShow.mp3',
            buzz: '/SFX/1_buzz.mp3',
            loop1: '/SFX/1_thinking_O10_loop_1.mp3',
            loop2: '/SFX/1_thinking_O10_loop_2.mp3',
            loop3: '/SFX/1_thinking_O10_loop_3.mp3',
            loop4: '/SFX/1_thinking_O10_loop_4.mp3',
            finish: '/SFX/1_Finish.mp3',
            right: '/SFX/1_Right.mp3',
            wrong: '/SFX/1_Wrong.mp3',
            r2StartRound: '/SFX/2_StartRound.mp3',
            r2RowShow: '/SFX/2_RowShow.mp3',
            r2RowChose: '/SFX/2_RowChose.mp3',
            r2RowQues: '/SFX/2_RowQues.mp3',
            r2OnTime: '/SFX/2_OnTime.mp3',
            r2ShowPiece: '/SFX/2_ShowPiece.mp3',
            r2ShowAnswer: '/SFX/2_ShowAnswer.mp3',
            r2RightRow: '/SFX/2_RightRow.mp3',
            r2WrongRow: '/SFX/2_WrongRow.mp3',
            r2Activate: '/SFX/2_Activate.mp3',
            r3StartRound: '/SFX/3_StartRound.mp3',
            r3Show: '/SFX/3_Show.mp3',
            r3Time20: '/SFX/3_20.mp3',
            r3Time30: '/SFX/3_30.mp3',
            r3Answer: '/SFX/3_Answer.mp3',
            r3Right: '/SFX/3_Right.mp3',
            r3Wrong: '/SFX/3_Wrong.mp3'
        };

        // Preload Round 2 cell & puzzle piece images for instant swap (Appear, no flicker)
        [
            '/Media/2.bg.png',
            '/Media/2.count.png',
            '/Media/2.buzzer.png',
            '/Media/h1.png',
            '/Media/h2.png',
            '/Media/h3.png',
            '/Media/Manh1.png',
            '/Media/Manh2.png',
            '/Media/Manh3.png',
            '/Media/Manh4.png',
            '/Media/Manh5.png'
        ].forEach(src => {
            const img = new Image();
            img.src = src;
        });

        const sfxBank = {};
        Object.keys(SFX_PATHS).forEach(key => {
            const a = new Audio(SFX_PATHS[key]);
            a.preload = 'auto';
            if (key === 'loop1' || key === 'loop2' || key === 'loop3') {
                a.loop = true;
            }
            sfxBank[key] = a;
        });

        let pendingBlockedAudio = null;

        function unlockProjectorAudio() {
            const banner = document.getElementById('audio_unlock_banner');
            if (banner) banner.style.display = 'none';
            if (pendingBlockedAudio) {
                const { key, loop } = pendingBlockedAudio;
                pendingBlockedAudio = null;
                playSfx(key, { loop });
            } else {
                // Silent touch unlock across bank
                Object.values(sfxBank).forEach(a => {
                    try {
                        if (a.paused) {
                            a.load();
                        }
                    } catch (e) {}
                });
            }
        }
        window.unlockProjectorAudio = unlockProjectorAudio;

        document.addEventListener('pointerdown', () => {
            if (pendingBlockedAudio) unlockProjectorAudio();
        }, { passive: true });

        function applyVolumeAll() {
            const vol = audioSettings.enabled ? audioSettings.volume : 0;
            Object.values(sfxBank).forEach(a => {
                a.volume = vol;
            });
            const introVid = document.getElementById('intro_video_player');
            if (introVid) introVid.volume = vol;
            const r3MediaVid = document.getElementById('r3_media_video');
            if (r3MediaVid) {
                r3MediaVid.muted = true;
                r3MediaVid.volume = 0;
            }
        }

        function stopAudioItem(audio) {
            if (!audio) return;
            try {
                audio.pause();
                audio.currentTime = 0;
            } catch (e) {}
        }

        function playSfx(key, options = {}) {
            const audio = sfxBank[key];
            if (!audio) return;
            if (!audioSettings.enabled) return;

            try {
                if (typeof options.loop === 'boolean') {
                    audio.loop = options.loop;
                }
                audio.volume = audioSettings.volume;
                if (audio.readyState > 0 && audio.currentTime !== 0) {
                    audio.currentTime = 0;
                }
                const p = audio.play();
                if (p && typeof p.catch === 'function') {
                    p.catch(err => {
                        if (err && err.name === 'NotAllowedError') {
                            pendingBlockedAudio = { key, loop: !!audio.loop };
                            const banner = document.getElementById('audio_unlock_banner');
                            if (banner) banner.style.display = 'block';
                        }
                    });
                }
            } catch (e) {}
        }

        function stopThinkingLoops() {
            stopAudioItem(sfxBank.loop1);
            stopAudioItem(sfxBank.loop2);
            stopAudioItem(sfxBank.loop3);
            stopAudioItem(sfxBank.loop4);
            activeThinkingLoop = 0;
        }

        function stopAllRound2Audio() {
            stopAudioItem(sfxBank.r2StartRound);
            stopAudioItem(sfxBank.r2RowShow);
            stopAudioItem(sfxBank.r2RowChose);
            stopAudioItem(sfxBank.r2RowQues);
            stopAudioItem(sfxBank.r2OnTime);
            stopAudioItem(sfxBank.r2ShowPiece);
            stopAudioItem(sfxBank.r2ShowAnswer);
            stopAudioItem(sfxBank.r2RightRow);
            stopAudioItem(sfxBank.r2WrongRow);
            stopAudioItem(sfxBank.r2Activate);
        }

        function stopAllRound3Audio(keepStartRound = false) {
            if (!keepStartRound) {
                stopAudioItem(sfxBank.r3StartRound);
            }
            stopAudioItem(sfxBank.r3Show);
            stopAudioItem(sfxBank.r3Time20);
            stopAudioItem(sfxBank.r3Time30);
            stopAudioItem(sfxBank.r3Answer);
            stopAudioItem(sfxBank.r3Right);
            stopAudioItem(sfxBank.r3Wrong);
        }

        function stopAllRound1Audio() {
            stopThinkingLoops();
            stopAudioItem(sfxBank.startRound);
            stopAudioItem(sfxBank.pStart);
            stopAudioItem(sfxBank.showQues);
            stopAudioItem(sfxBank.buzz);
            stopAudioItem(sfxBank.finish);
            stopAudioItem(sfxBank.right);
            stopAudioItem(sfxBank.wrong);
            pendingBlockedAudio = null;
        }

        function switchProjectorScene(sceneNum) {
            document.querySelectorAll('.projector-scene').forEach(el => {
                el.classList.remove('active');
            });
            const target = document.getElementById(`view-file-${sceneNum}`);
            if (target) {
                target.classList.add('active');
            }
        }

        // Round 2 (Vượt Chướng Ngại Vật) Exact PPT Coordinates (1" = 144px on 1920x1080)
        const PPT_PPI = 144;
        const R2_COL_X_IN = [
            6.5277, 7.0151, 7.5025, 7.9899, 8.4773,
            8.9647, 9.4521, 9.9395, 10.4269, 10.9143
        ];
        const R2_ROW_Y_IN = [1.6429, 2.2292, 2.8156, 3.4020];
        let r2VuotSongData = null;
        let isRound2RowsShown = false;
        let r2SelectedRow = null;
        let r2RowStates = { 1: 'default', 2: 'default', 3: 'default', 4: 'default' }; // 'default' | 'right' | 'wrong'
        let r2RowCustomAnswers = {};
        let r2OpenedPieces = { 1: false, 2: false, 3: false, 4: false, 5: false };
        let r2Buzzers = []; // Array of { id, name } ordered fastest -> slowest (max 4)

        function formatRound2CnvCountText(vsData) {
            const src = vsData || r2VuotSongData || {};
            const rawKw = (src.keyword || (src.center && src.center.a) || '').toString().trim();
            const compact = rawKw.replace(/\s+/g, '');
            if (!compact) return '';

            const charCount = Array.from(compact).length;
            const onlyLetters = /^[\p{L}]+$/u.test(compact);
            const onlyDigits = /^[0-9]+$/.test(compact);

            let unit = 'KÝ TỰ';
            if (onlyLetters) {
                unit = 'CHỮ CÁI';
            } else if (onlyDigits) {
                unit = 'CHỮ SỐ';
            }

            return `CHƯỚNG NGẠI VẬT CÓ ${charCount} ${unit}`;
        }

        function updateRound2CnvCountBox() {
            const box = document.getElementById('vs_cnv_count_box');
            const textEl = document.getElementById('vs_cnv_count_text');
            if (!box || !textEl) return;

            const label = formatRound2CnvCountText(r2VuotSongData);
            if (isRound2RowsShown && label) {
                textEl.textContent = label;
                textEl.style.fontSize = '32px';
                box.style.display = 'flex';
            } else {
                box.style.display = 'none';
                textEl.textContent = '';
            }
        }

        function syncRound2Data(vsData) {
            if (!vsData || typeof vsData !== 'object' || Array.isArray(vsData)) return;
            r2VuotSongData = vsData;
            updateRound2HintImage();
            updateRound2CnvCountBox();
        }

        function updateRound2HintImage() {
            const hintImg = document.getElementById('vs_hint_img');
            if (!hintImg) return;
            const hintUrl = (r2VuotSongData && r2VuotSongData.hintImage ? String(r2VuotSongData.hintImage).trim() : '');
            if (hintUrl) {
                if (hintImg.getAttribute('src') !== hintUrl) {
                    hintImg.setAttribute('src', hintUrl);
                }
                hintImg.style.display = isRound2RowsShown ? 'block' : 'none';
            } else {
                hintImg.style.display = 'none';
                hintImg.removeAttribute('src');
            }
        }

        function updateRound2PiecesVisibility() {
            for (let i = 1; i <= 5; i++) {
                const pieceEl = document.getElementById(`vs_piece_${i}`);
                if (!pieceEl) continue;
                const shouldShow = isRound2RowsShown && !r2OpenedPieces[i];
                pieceEl.style.display = shouldShow ? 'block' : 'none';
            }
        }

        function getRound2RowAnswerChars(rowNum, vsData) {
            const src = vsData || r2VuotSongData || {};
            const rawAns = (
                r2RowCustomAnswers[rowNum] !== undefined
                    ? r2RowCustomAnswers[rowNum]
                    : (src[`h${rowNum}`]?.a || '')
            ).toString().replace(/\s+/g, '').toLocaleUpperCase('vi-VN');
            return Array.from(rawAns).slice(0, 10);
        }

        function getRound2CellSrc(rowNum) {
            const state = r2RowStates[rowNum] || 'default';
            if (state === 'wrong') return '/Media/h3.png';
            if (state === 'right') return '/Media/h2.png';
            return r2SelectedRow === rowNum ? '/Media/h2.png' : '/Media/h1.png';
        }

        function updateRound2RowGraphics() {
            const container = document.getElementById('vs_rows_container');
            if (!container) return;
            const cells = container.querySelectorAll('.vs-row-cell');
            if (!cells.length) {
                renderRound2Rows(r2VuotSongData);
                return;
            }
            const rowCharsCache = {};
            cells.forEach(cellEl => {
                const rowNum = parseInt(cellEl.dataset.row, 10);
                const charIdx = parseInt(cellEl.dataset.charIndex, 10);
                const state = r2RowStates[rowNum] || 'default';
                const targetSrc = getRound2CellSrc(rowNum);
                const img = cellEl.querySelector('.vs-row-cell-img');
                const letterEl = cellEl.querySelector('.vs-row-cell-letter');
                if (img && img.getAttribute('src') !== targetSrc) {
                    img.setAttribute('src', targetSrc);
                }
                if (letterEl) {
                    if (state === 'right') {
                        if (!rowCharsCache[rowNum]) {
                            rowCharsCache[rowNum] = getRound2RowAnswerChars(rowNum, r2VuotSongData);
                        }
                        const ch = rowCharsCache[rowNum][charIdx] || '';
                        letterEl.textContent = ch;
                        letterEl.style.display = ch ? 'flex' : 'none';
                    } else {
                        letterEl.textContent = '';
                        letterEl.style.display = 'none';
                    }
                }
            });
        }

        function renderRound2Rows(vsData) {
            const container = document.getElementById('vs_rows_container');
            if (!container) return;
            const src = vsData || r2VuotSongData || {};

            const rowCharsList = [];
            let hasAnyAnswer = false;
            for (let r = 1; r <= 4; r++) {
                const chars = getRound2RowAnswerChars(r, src);
                if (chars.length > 0) hasAnyAnswer = true;
                rowCharsList.push(chars);
            }

            const frag = document.createDocumentFragment();
            for (let rowIdx = 0; rowIdx < 4; rowIdx++) {
                const rowNum = rowIdx + 1;
                const rowChars = rowCharsList[rowIdx];
                const count = hasAnyAnswer ? rowChars.length : 10;
                if (count <= 0) continue;
                const startCol = 10 - count;
                const topPx = R2_ROW_Y_IN[rowIdx] * PPT_PPI;
                const cellSrc = getRound2CellSrc(rowNum);
                const isRowRight = (r2RowStates[rowNum] === 'right');

                for (let colIdx = startCol; colIdx < 10; colIdx++) {
                    const charIdx = colIdx - startCol;
                    const cellDiv = document.createElement('div');
                    cellDiv.className = 'vs-row-cell';
                    cellDiv.dataset.row = String(rowNum);
                    cellDiv.dataset.charIndex = String(charIdx);
                    cellDiv.style.left = `${(R2_COL_X_IN[colIdx] * PPT_PPI).toFixed(4)}px`;
                    cellDiv.style.top = `${topPx.toFixed(4)}px`;

                    const img = document.createElement('img');
                    img.className = 'vs-row-cell-img';
                    img.src = cellSrc;
                    img.alt = `Ô ${rowIdx * 10 + colIdx + 1}`;
                    cellDiv.appendChild(img);

                    const letterEl = document.createElement('span');
                    letterEl.className = 'vs-row-cell-letter';
                    const ch = isRowRight ? (rowChars[charIdx] || '') : '';
                    if (ch) {
                        letterEl.textContent = ch;
                        letterEl.style.display = 'flex';
                    }
                    cellDiv.appendChild(letterEl);

                    frag.appendChild(cellDiv);
                }
            }
            container.innerHTML = '';
            container.appendChild(frag);
        }

        function detectRound3MediaType(url, explicitType = '') {
            if (explicitType === 'image' || explicitType === 'video') return explicitType;
            const clean = (url || '').toString().trim();
            if (!clean) return 'none';
            if (clean.startsWith('data:image/') || /\.(png|jpe?g|gif|webp|bmp|svg|avif)(\?|#|$)/i.test(clean)) {
                return 'image';
            }
            if (clean.startsWith('data:video/') || /\.(mp4|webm|mov|m4v|avi|mkv|ogv)(\?|#|$)/i.test(clean)) {
                return 'video';
            }
            return 'video';
        }

        function normalizeRound3MediaUrl(url) {
            const clean = (url || '').toString().trim();
            if (!clean) return '';
            if (clean.startsWith('./')) return '/' + clean.slice(2);
            if (/^uploads\//i.test(clean)) return '/' + clean;
            return clean;
        }

        function applyRound3AnswerWarp(el) {
            if (!el) return;
            const box = el.parentElement;
            if (!box) return;
            el.style.fontSize = '48px';
            el.style.transform = 'none';
            const cs = window.getComputedStyle(box);
            const padLeft = parseFloat(cs.paddingLeft) || 0;
            const padRight = parseFloat(cs.paddingRight) || 0;
            const maxWidth = Math.max(40, box.clientWidth - padLeft - padRight);
            const boxRectWidth = box.getBoundingClientRect().width;
            const stageScale = (box.offsetWidth > 0 && boxRectWidth > 0)
                ? (boxRectWidth / box.offsetWidth)
                : 1;
            const rectWidth = el.getBoundingClientRect().width;
            const textWidth = (rectWidth > 0 && stageScale > 0)
                ? (rectWidth / stageScale)
                : (el.scrollWidth || el.offsetWidth || 0);
            if (textWidth > maxWidth && textWidth > 0) {
                const ratio = maxWidth / textWidth;
                el.style.transform = `scaleX(${ratio})`;
            } else {
                el.style.transform = 'none';
            }
        }

        function sortRound3ContestantsForDisplay(list) {
            const items = [];
            for (let i = 0; i < 4; i++) {
                const ts = (Array.isArray(list) && list[i]) ? list[i] : {};
                const fallbackName = (r1Contestants[i] && r1Contestants[i].name) || `Thí sinh ${i + 1}`;
                const pName = (ts.name && String(ts.name).trim())
                    ? String(ts.name).replace(/\s*\(\d+\)/g, '').replace(/\s*\([\d\.]+(?:s|giây|S)?\)/gi, '').trim()
                    : fallbackName;
                const rawAns = ts.answer !== undefined && ts.answer !== null
                    ? ts.answer
                    : (ts.rk_answer !== undefined && ts.rk_answer !== null ? ts.rk_answer : '');
                const ansText = String(rawAns).trim();

                let rawTime = ts.time !== undefined && ts.time !== null
                    ? ts.time
                    : (ts.rk_time !== undefined && ts.rk_time !== null ? ts.rk_time : '');
                rawTime = String(rawTime).replace(/s|giây/gi, '').trim();
                const num = parseFloat(rawTime);
                const hasValidTime = !isNaN(num) && num > 0;
                const formattedTime = !isNaN(num)
                    ? (num < 10 ? '0' + num.toFixed(2) : num.toFixed(2))
                    : '00.00';

                items.push({
                    name: pName,
                    answer: ansText,
                    time: formattedTime,
                    _sortTime: hasValidTime ? num : (ansText ? (999000 + i) : (999999 + i))
                });
            }
            items.sort((a, b) => a._sortTime - b._sortTime);
            return items;
        }

        function computeTargetThinkingLoop(questionIndex, totalQuestions) {
            const q = Math.max(1, parseInt(questionIndex, 10) || 1);
            const total = Math.max(1, parseInt(totalQuestions, 10) || 6);

            if (total <= 6) {
                if (q >= 6) return 4;
                if (q >= 5) return 3;
                if (q >= 3) return 2;
                return 1;
            }

            if (total === 12) {
                if (q >= 12) return 4;
                if (q === 11) return 3;
                if (q >= 6) return 2;
                return 1;
            }

            const loop4At = total;
            const loop3At = Math.max(2, total - 1);
            const loop2At = Math.max(2, Math.floor((total - 2) / 2) + 1);

            if (q >= loop4At) return 4;
            if (q >= loop3At) return 3;
            if (q >= loop2At) return 2;
            return 1;
        }

        function playThinkingLoopForQuestion(questionIndex, totalQuestions, forceRestart = false) {

            stopThinkingLoops();

            const loopKey = `loop${targetLoop}`;

        // Message Deduplication across WS / BroadcastChannel / Storage / postMessage
        const seenActionKeys = new Map();
        function isDuplicateMessage(data) {
            if (!data || !data.type) return true;
            const key = data._msgId || data.id || `${data.type}_${data.timestamp || data._timestamp || ''}`;
            if (!key) return false;
            const now = Date.now();
            if (seenActionKeys.size > 200) {
                for (const [k, t] of seenActionKeys.entries()) {
                    if (now - t > 10000) seenActionKeys.delete(k);
                }
            }
            if (seenActionKeys.has(key)) return true;
            seenActionKeys.set(key, now);
            return false;
        }

        function handleProjectorMessage(data) {
            if (!data || typeof data !== 'object') return;
            if (isDuplicateMessage(data)) return;

            const type = data.type;

            switch (type) {
                case 'START_ROUND_CLEAN': {
                    handleIntroStop();
                    const summaryEl = document.getElementById('summary_overlay');
                    if (summaryEl) summaryEl.style.display = 'none';
                    if (data.contestants) syncContestantsData(data.contestants);
                    if (data.vuotSong) syncRound2Data(data.vuotSong);

                    if (data.roundIndex === 1 || data.round === 'XUAT_PHAT' || data.activeRound === 'XUAT_PHAT') {
                        switchProjectorScene(1);
                        activeTurnIndex = 0;
                        xpFastestWinner = 0;
                        xpBuzzerOpen = false;
                        hideAllRound1Graphics();
                        hideAllRound2Graphics();
                        hideAllRound3Graphics();
                        stopAllRound1Audio();
                        stopAllRound2Audio();
                        stopAllRound3Audio();
                        playSfx('startRound', { loop: false });
                    } else if (data.roundIndex === 2 || data.round === 'RA_KHOI' || data.activeRound === 'RA_KHOI') {
                        switchProjectorScene(3);
                        activeTurnIndex = 0;
                        xpFastestWinner = 0;
                        xpBuzzerOpen = false;
                        hideAllRound1Graphics();
                        hideAllRound2Graphics();
                        hideAllRound3Graphics();
                        stopAllRound1Audio();
                        stopAllRound2Audio();
                        stopAllRound3Audio();
                        r3LastStartRoundAt = Date.now();
                        playSfx('r3StartRound', { loop: false });
                    } else if (data.roundIndex === 3 || data.round === 'VUOT_SONG' || data.activeRound === 'VUOT_SONG') {
                        switchProjectorScene(2);
                        activeTurnIndex = 0;
                        xpFastestWinner = 0;
                        xpBuzzerOpen = false;
                        hideAllRound1Graphics();
                        hideAllRound2Graphics();
                        hideAllRound3Graphics();
                        stopAllRound1Audio();
                        stopAllRound2Audio();
                        stopAllRound3Audio();
                        playSfx('r2StartRound', { loop: false });
                    }
                    break;
                }

                case 'RA_KHOI_INTRO': {
                    handleIntroStop();
                    const summaryEl = document.getElementById('summary_overlay');
                    if (summaryEl) summaryEl.style.display = 'none';
                    switchProjectorScene(3);
                    hideAllRound1Graphics();
                    hideAllRound2Graphics();
                    hideAllRound3Graphics();
                    stopAllRound1Audio();
                    stopAllRound2Audio();
                    if (Date.now() - r3LastStartRoundAt > 800) {
                        stopAllRound3Audio();
                        r3LastStartRoundAt = Date.now();
                        playSfx('r3StartRound', { loop: false });
                    }
                    break;
                }

                case 'RA_KHOI_SELECT_QUESTION': {
                    handleRound3SelectQuestion(data);
                    break;
                }

                case 'RA_KHOI_SHOW_QUESTION':
                case 'RA_KHOI_PLAY_CLIP': {
                    handleRound3ShowQuestion(data);
                    break;
                }

                case 'RA_KHOI_START_TIMER': {
                    handleRound3StartTimer(data);
                    break;
                }

                case 'RA_KHOI_PREPARE_ANSWERS': {
                    handleRound3PrepareAnswers(data);
                    break;
                }

                case 'RA_KHOI_SHOW_CONTESTANT_ANSWERS': {
                    handleRound3ShowAnswers(data);
                    break;
                }

                case 'RA_KHOI_GRADE_RESULT': {
                    if (data.contestants) syncContestantsData(data.contestants);
                    stopAudioItem(sfxBank.r3Right);
                    stopAudioItem(sfxBank.r3Wrong);
                    if (data.hasCorrect) {
                        playSfx('r3Right', { loop: false });
                    } else {
                        playSfx('r3Wrong', { loop: false });
                    }
                    break;
                }

                case 'RA_KHOI_RESET': {
                    if (data.contestants) syncContestantsData(data.contestants);
                    switchProjectorScene(3);
                    hideAllRound3Graphics();
                    stopAllRound3Audio(!!data.keepRoundStartSound);
                    if (data.questionIndex !== undefined) {
                        syncRound3QuestionMeta(data);
                    }
                    break;
                }

                case 'VUOT_SONG_SHOW_ROWS': {
                    handleIntroStop();
                    const summaryEl = document.getElementById('summary_overlay');
                    if (summaryEl) summaryEl.style.display = 'none';
                    if (data.contestants) syncContestantsData(data.contestants);
                    hideRound2AnswerSceneContent();
                    switchProjectorScene(2);
                    stopAllRound1Audio();
                    stopAudioItem(sfxBank.r2StartRound);
                    stopAudioItem(sfxBank.r2ShowAnswer);
                    showRound2Rows(data);
                    playSfx('r2RowShow', { loop: false });
                    break;
                }

                case 'VUOT_SONG_SELECT_ROW': {
                    const incomingVS = data.vuotSong || (data.gameData && data.gameData.vuotSong);
                    if (incomingVS) syncRound2Data(incomingVS);
                    const rowNum = parseInt(data.row, 10);
                    r2SelectedRow = (rowNum >= 1 && rowNum <= 4) ? rowNum : null;
                    hideRound2AnswerSceneContent();
                    switchProjectorScene(2);
                    stopRound2TimerVideo();
                    hideRound2QuestionBox();
                    if (isRound2RowsShown) {
                        updateRound2RowGraphics();
                    }
                    if (rowNum >= 1 && rowNum <= 4) {
                        stopAudioItem(sfxBank.r2RowShow);
                        stopAudioItem(sfxBank.r2ShowAnswer);
                        playSfx('r2RowChose', { loop: false });
                    }
                    break;
                }

                case 'VUOT_SONG_SHOW_QUESTION': {
                    hideRound2AnswerSceneContent();
                    stopAudioItem(sfxBank.r2ShowAnswer);
                    handleRound2ShowQuestion(data);
                    break;
                }

                case 'VUOT_SONG_START_TIMER': {
                    hideRound2AnswerSceneContent();
                    stopAudioItem(sfxBank.r2ShowAnswer);
                    handleRound2StartTimer(data);
                    break;
                }

                case 'VUOT_SONG_PREPARE_ANSWERS': {
                    handleRound2PrepareAnswers(data);
                    break;
                }

                case 'VUOT_SONG_SHOW_CONTESTANT_ANSWERS': {
                    handleRound2ShowAnswers(data);
                    break;
                }

                case 'VUOT_SONG_RETURN_GRID': {
                    hideRound2AnswerSceneContent();
                    switchProjectorScene(2);
                    stopRound2TimerVideo();
                    hideRound2QuestionBox();
                    stopAudioItem(sfxBank.r2RowQues);
                    stopAudioItem(sfxBank.r2OnTime);
                    stopAudioItem(sfxBank.r2ShowAnswer);
                    if (!isRound2RowsShown) {
                        showRound2Rows(data);
                    }
                    break;
                }

                case 'VUOT_SONG_OPEN_ROW_ANSWER': {
                    handleRound2OpenRowAnswer(data);
                    break;
                }

                case 'VUOT_SONG_CLOSE_ROW_ANSWER': {
                    handleRound2CloseRowAnswer(data);
                    break;
                }

                case 'VUOT_SONG_OPEN_ALL_ANSWERS': {
                    const incomingVS = data.vuotSong || (data.gameData && data.gameData.vuotSong);
                    if (incomingVS) syncRound2Data(incomingVS);
                    hideRound2AnswerSceneContent();
                    switchProjectorScene(2);
                    for (let r = 1; r <= 4; r++) {
                        r2RowStates[r] = 'right';
                    }
                    if (!isRound2RowsShown) {
                        showRound2Rows(data);
                    } else {
                        renderRound2Rows(r2VuotSongData);
                    }
                    break;
                }

                case 'VUOT_SONG_OPEN_PIECE': {
                    hideRound2AnswerSceneContent();
                    stopAudioItem(sfxBank.r2ShowAnswer);
                    handleRound2OpenPiece(data);
                    break;
                }

                case 'VUOT_SONG_SYNC_GRID': {
                    if (data.vuotSong) {
                        syncRound2Data(data.vuotSong);
                        if (isRound2RowsShown) {
                            renderRound2Rows(r2VuotSongData);
                        }
                    }
                    break;
                }

                case 'VUOT_SONG_RESET': {
                    if (data.contestants) syncContestantsData(data.contestants);
                    if (data.vuotSong) syncRound2Data(data.vuotSong);
                    switchProjectorScene(2);
                    hideAllRound2Graphics();
                    if (!data.keepRoundStartSound) {
                        stopAllRound2Audio();
                    }
                    break;
                }

                case 'XUAT_PHAT_RESET': {
                    if (data.contestants) syncContestantsData(data.contestants);
                    activeTurnIndex = parseInt(data.turnIndex, 10) || 0;
                    xpFastestWinner = 0;
                    xpBuzzerOpen = false;
                    hideAllRound1Graphics();
                    if (!data.keepRoundStartSound) {
                        stopAllRound1Audio();
                    }
                    break;
                }

                case 'XUAT_PHAT_PSTART': {
                    if (data.contestants) syncContestantsData(data.contestants);
                    if (data.turnIndex) {
                        activeTurnIndex = parseInt(data.turnIndex, 10) || activeTurnIndex;
                    }
                    stopAudioItem(sfxBank.startRound);
                    stopThinkingLoops();
                    playSfx('pStart', { loop: false });
                    break;
                }

                case 'XUAT_PHAT_SELECT_CONTESTANT': {
                    if (data.contestants) syncContestantsData(data.contestants);
                    if (data.turnIndex) {
                        activeTurnIndex = parseInt(data.turnIndex, 10) || 0;
                    }
                    xpFastestWinner = 0;
                    xpBuzzerOpen = false;
                    if (isRound1MetaRevealed) {
                        updateActiveHighlight(activeTurnIndex);
                    }
                    break;
                }

                case 'XUAT_PHAT_SELECT_CHUNG': {
                    if (data.contestants) syncContestantsData(data.contestants);
                    activeTurnIndex = 5;
                    xpFastestWinner = 0;
                    xpBuzzerOpen = false;
                    if (isRound1MetaRevealed) {
                        updateActiveHighlight(0);
                    }
                    break;
                }

                case 'XUAT_PHAT_SHOW_GRAPHIC_CAU_HOI': {
                    handleIntroStop();
                    const summaryEl = document.getElementById('summary_overlay');
                    if (summaryEl) summaryEl.style.display = 'none';
                    handleShowGraphicCauHoi(data);
                    break;
                }

                case 'XUAT_PHAT_HIEN_CAU_HOI':
                case 'XUAT_PHAT_BAT_DAU_CAU_HOI': {
                    handleIntroStop();
                    const summaryEl = document.getElementById('summary_overlay');
                    if (summaryEl) summaryEl.style.display = 'none';
                    handleHienCauHoi(data);
                    break;
                }

                case 'XUAT_PHAT_NEXT_QUESTION': {
                    handleNextQuestion(data);
                    break;
                }

                case 'PLAYER_RING_BELL':
                case 'RING_BELL': {
                    const r = (data.round || '').toString().toUpperCase();
                    const isR2SceneActive =
                        document.getElementById('view-file-2')?.classList.contains('active') ||
                        document.getElementById('view-file-2-answers')?.classList.contains('active');
                    if (r === 'KD' || r === 'XUAT_PHAT' || r === 'KHOI_DONG' || r === 'XP' || (!r && !isR2SceneActive && activeTurnIndex === 5)) {
                        const winner = data.winnerId || data.contestantId || data.contestantIndex;
                        handleXuatPhatFastestBuzz(winner, false);
                    } else if (r === 'VS' || r === 'VUOT_SONG' || r === 'VCNV' || r === 'CNV' || (!r && isR2SceneActive)) {
                        const buzzTs = data.contestantId || data.winnerId || data.contestantIndex;
                        handleRound2BuzzerPress(buzzTs, data.contestantName);
                    }
                    break;
                }

                case 'S3_FLASH_SCOREBOARD':
                case 'VUOT_SONG_BUZZER_UPDATE': {
                    const buzzTs = data.contestantId || data.winnerId || data.contestantIndex;
                    handleRound2BuzzerPress(buzzTs, data.contestantName);
                    break;
                }

                case 'PLAYER_SUBMIT_ANSWER': {
                    const r = (data.round || '').toString().toUpperCase();
                    if ((r === 'VS' || r === 'VUOT_SONG' || r === 'VCNV' || r === 'CNV') && data.isVongThi === true) {
                        const buzzTs = data.contestantId || data.winnerId || data.contestantIndex;
                        handleRound2BuzzerPress(buzzTs, data.contestantName);
                    }
                    break;
                }

                case 'RESET_VS_BELL':
                case 'VUOT_SONG_RESET_BELL':
                case 'RESET_BELL_VCNV': {
                    handleRound2ResetBells(data.contestantId || 'ALL');
                    break;
                }

                case 'RESET_BELL': {
                    const r = (data.round || '').toString().toUpperCase();
                    if (!r || r === 'VS' || r === 'VUOT_SONG' || r === 'VCNV' || r === 'CNV') {
                        handleRound2ResetBells(data.contestantId || 'ALL');
                    }
                    break;
                }

                case 'XUAT_PHAT_SHOW_FASTEST_HL': {
                    const winner = data.contestantIndex || data.whoBuzzed || data.contestantId || data.winnerId;
                    handleXuatPhatFastestBuzz(winner, true);
                    break;
                }

                case 'UNLOCK_BELLS': {
                    if (activeTurnIndex === 5 || parseInt(data.turnIndex, 10) === 5) {
                        activeTurnIndex = 5;
                        xpFastestWinner = 0;
                        xpBuzzerOpen = true;
                        updateActiveHighlight(0);
                    }
                    break;
                }

                case 'LOCK_BELLS': {
                    if (activeTurnIndex === 5) {
                        xpBuzzerOpen = false;
                        const winner = data.contestantIndex || data.whoBuzzed || data.contestantId;
                        if (winner && xpFastestWinner === 0) {
                            handleXuatPhatFastestBuzz(winner, true);
                        }
                    }
                    break;
                }

                case 'XUAT_PHAT_RIGHT': {
                    if (data.contestants) {
                        syncContestantsData(data.contestants);
                    } else {
                        const targetTs = parseInt(data.targetContestantId || data.contestantId || data.turnIndex, 10);
                        if (targetTs >= 1 && targetTs <= 4 && data.score !== undefined && r1Contestants[targetTs - 1]) {
                            r1Contestants[targetTs - 1].score = Number(data.score) || 0;
                            renderContestantsUI();
                        }
                    }
                    if (activeTurnIndex === 5) xpBuzzerOpen = false;
                    playSfx('right', { loop: false });
                    break;
                }

                case 'XUAT_PHAT_WRONG': {
                    if (data.contestants) {
                        syncContestantsData(data.contestants);
                    } else {
                        const targetTs = parseInt(data.targetContestantId || data.contestantId || data.turnIndex, 10);
                        if (targetTs >= 1 && targetTs <= 4 && data.score !== undefined && r1Contestants[targetTs - 1]) {
                            r1Contestants[targetTs - 1].score = Number(data.score) || 0;
                            renderContestantsUI();
                        }
                    }
                    if (activeTurnIndex === 5) xpBuzzerOpen = false;
                    playSfx('wrong', { loop: false });
                    break;
                }

                case 'XUAT_PHAT_FINISH': {
                    xpFastestWinner = 0;
                    xpBuzzerOpen = false;
                    hideAllRound1Graphics();
                    stopThinkingLoops();
                    stopAudioItem(sfxBank.showQues);
                    stopAudioItem(sfxBank.pStart);
                    stopAudioItem(sfxBank.startRound);
                    stopAudioItem(sfxBank.buzz);
                    playSfx('finish', { loop: false });
                    break;
                }

                case 'XUAT_PHAT_STOP_SOUND':
                case 'STOP_SOUND': {
                    stopAllRound1Audio();
                    stopAllRound2Audio();
                    stopAllRound3Audio();
                    break;
                }

                case 'UPDATE_SCORES':
                case 'UPDATE_CONTESTANTS':
                case 'SYNC_GAME_DATA':
                case 'FULL_STATE_SYNC': {
                    if (data.contestants) syncContestantsData(data.contestants);
                    else if (data.gameData && data.gameData.contestants) syncContestantsData(data.gameData.contestants);

                    const incomingVS = data.vuotSong || (data.gameData && data.gameData.vuotSong);
                    if (incomingVS) {
                        syncRound2Data(incomingVS);
                    }
                    if (data.vuotSongRow !== undefined) {
                        const rowNum = parseInt(data.vuotSongRow, 10);
                        r2SelectedRow = (rowNum >= 1 && rowNum <= 4) ? rowNum : null;
                    }
                    if (isRound2RowsShown && (incomingVS || data.vuotSongRow !== undefined)) {
                        renderRound2Rows(r2VuotSongData);
                    }
                    break;
                }

                case 'PLAY_INTRO_VIDEO': {
                    handleIntroPlay(data);
                    break;
                }

                case 'STOP_INTRO_VIDEO': {
                    handleIntroStop();
                    break;
                }

                case 'TOGGLE_SUMMARY': {
                    handleToggleSummary(data);
                    break;
                }

                case 'UPDATE_AUDIO_SETTINGS': {
                    if (data.audioSettings) {
                        audioSettings.enabled = data.audioSettings.projectorEnabled !== false;
                        audioSettings.volume = typeof data.audioSettings.projectorVolume === 'number'
                            ? Math.max(0, Math.min(1, data.audioSettings.projectorVolume / 100))
                            : 1.0;
                        applyVolumeAll();
                    }
                    break;
                }

                case 'RESET_ALL_DATA': {
                    activeTurnIndex = 0;
                    switchProjectorScene(1);
                    hideAllRound1Graphics();
                    hideAllRound2Graphics();
                    hideAllRound3Graphics();
                    stopAllRound1Audio();
                    stopAllRound2Audio();
                    stopAllRound3Audio();
                    r1Contestants = [
                        { name: 'Thí sinh 1', score: 0 },
                        { name: 'Thí sinh 2', score: 0 },
                        { name: 'Thí sinh 3', score: 0 },
                        { name: 'Thí sinh 4', score: 0 }
                    ];
                    renderContestantsUI();
                    break;
                }

                case 'RELOAD_CLIENT': {
                    if (data.target === 'all' || data.target === 'projector' || data.role === 'projector') {
                        window.location.reload();
                    }
                    break;
                }
            }
        }
        window.handleProjectorMessage = handleProjectorMessage;

        // Multi-channel listeners (BroadcastChannel, localStorage, window.message)
        let projBroadcastChannel = null;
        try {
            projBroadcastChannel = new BroadcastChannel('ddvq_game_channel');
            projBroadcastChannel.onmessage = (event) => {
                if (event && event.data) {
                    handleProjectorMessage(event.data);
                }
            };
        } catch (e) {}

        window.addEventListener('storage', (event) => {
            if (!event) return;
            if (event.key === 'ddvq_latest_action' && event.newValue) {
                try {
                    const parsed = JSON.parse(event.newValue);
                    handleProjectorMessage(parsed);
                } catch (e) {}
            } else if (event.key === 'duong_den_vinh_quang_data' && event.newValue) {
                try {
                    const parsed = JSON.parse(event.newValue);
                    if (parsed && parsed.contestants) syncContestantsData(parsed.contestants);
                    if (parsed && parsed.vuotSong) {
                        syncRound2Data(parsed.vuotSong);
                        if (isRound2RowsShown) renderRound2Rows(r2VuotSongData);
                    }
                } catch (e) {}
            }
        });

        window.addEventListener('message', (event) => {
            if (event && event.data && typeof event.data === 'object') {
                handleProjectorMessage(event.data);
            }
        });

        // Initial State Hydration from localStorage and /api/state
        function hydrateInitialProjectorState() {
            try {
                const rawGameData = localStorage.getItem('duong_den_vinh_quang_data');
                if (rawGameData) {
                    const parsed = JSON.parse(rawGameData);
                    if (parsed && parsed.contestants) syncContestantsData(parsed.contestants);
                    if (parsed && parsed.vuotSong) syncRound2Data(parsed.vuotSong);
                }
            } catch (e) {}

            if (typeof hasLocalServerBackend === 'function' && hasLocalServerBackend()) {
                const apiUrl = typeof getApiUrl === 'function' ? getApiUrl('/api/state') : '/api/state';
                fetch(apiUrl)
                    .then(res => res.json())
                    .then(state => {
                        if (!state) return;
                        if (state.contestants) syncContestantsData(state.contestants);
                        else if (state.gameData && state.gameData.contestants) syncContestantsData(state.gameData.contestants);

                        if (state.vuotSongRow !== undefined) {
                            const rowNum = parseInt(state.vuotSongRow, 10);
                            r2SelectedRow = (rowNum >= 1 && rowNum <= 4) ? rowNum : null;
                        }
                        const vs = state.vuotSong || (state.gameData && state.gameData.vuotSong);
                        if (vs) {
                            syncRound2Data(vs);
                            if (isRound2RowsShown) renderRound2Rows(r2VuotSongData);
                        }
                    })
                    .catch(() => {});
            }
        }

        // Presence / Heartbeat so Controller sees Projector Online
        function sendProjectorHeartbeat(isReady = false) {
            const payload = {
                type: isReady ? 'PROJECTOR_READY' : 'CLIENT_HEARTBEAT',
                role: 'projector',
                name: 'Máy Chiếu',
                timestamp: Date.now()
            };
            if (typeof sendSupabaseAction === 'function') {
                try { sendSupabaseAction(payload); } catch (e) {}
            }
            if (projBroadcastChannel) {
                try { projBroadcastChannel.postMessage(payload); } catch (e) {}
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            renderContestantsUI();
            applyVolumeAll();
            hydrateInitialProjectorState();
            setTimeout(() => sendProjectorHeartbeat(true), 250);
            setInterval(() => sendProjectorHeartbeat(false), 5000);
        });
    </script>
</body>
</html>
