<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Màn Hình Chiếu - Đường Đến Vinh Quang</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="designer-runtime.js?v=20261124a"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-sync.js?v=20261124a"></script>
    <style>
        @font-face {
            font-family: 'UTM Avo';
            src: local('UTM Avo'), local('UTMAvo'), local('UTM Avo Regular');
            font-weight: 400;
            font-style: normal;
            font-display: swap;
        }

        @font-face {
            font-family: 'UTM Avo';
            src: local('UTM Avo Bold'), local('UTMAvoBold'), local('UTM Avo'), local('UTMAvo');
            font-weight: 600;
            font-style: normal;
            font-display: swap;
        }

        @font-face {
            font-family: 'UTM Avo';
            src: local('UTM Avo Bold'), local('UTMAvoBold'), local('UTM Avo'), local('UTMAvo');
            font-weight: 700;
            font-style: normal;
            font-display: swap;
        }

        @font-face {
            font-family: 'MyriadProSemibold';
            src: url('/MYRIADPRO-SEMIBOLD.OTF') format('opentype');
            font-weight: 600;
            font-style: normal;
            font-display: swap;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: #000000;
            font-family: 'UTM Avo', 'Montserrat', 'MyriadProSemibold', 'Segoe UI', Arial, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
        }

        #stage-wrapper {
            position: relative;
            width: 1920px;
            height: 1080px;
            transform-origin: center center;
            overflow: hidden;
            background: #13ff08;
            flex-shrink: 0;
        }

        .projector-scene {
            position: absolute;
            inset: 0;
            width: 1920px;
            height: 1080px;
            display: none;
        }

        .projector-scene.active {
            display: block;
        }

        /* Round 1: Khởi Động (#13ff08 matches 1_showques_4P.mp4 chroma key background) */
        #view-file-1 {
            background: #13ff08;
        }

        #xp_showques_video {
            position: absolute;
            left: 0;
            top: 0;
            width: 1920px;
            height: 1080px;
            object-fit: cover;
            z-index: 10;
            opacity: 0;
            pointer-events: none;
        }

        /* Exact PowerPoint 16:9 (13.3333" x 7.5" -> 1920px x 1080px, 1" = 144px) coordinates */
        .xp-highlight {
            position: absolute;
            top: 740.16px;
            height: 59.04px;
            z-index: 20;
            opacity: 0;
            transition: opacity 0.45s ease;
            pointer-events: none;
            overflow: hidden;
        }

        .xp-highlight img {
            width: 100%;
            height: 100%;
            display: block;
            object-fit: fill;
        }

        #xp_highlight_1 { left: 256.32px; width: 362.88px; }
        #xp_highlight_2 { left: 603.36px; width: 362.88px; }
        #xp_highlight_3 { left: 953.28px; width: 362.88px; }
        #xp_highlight_4 { left: 1304.64px; width: 358.56px; }

        .xp-contestant-box {
            position: absolute;
            top: 740.16px;
            height: 59.04px;
            z-index: 30;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            padding: 0 26px;
            opacity: 0;
            transition: opacity 0.45s ease;
            pointer-events: none;
            color: #ffffff;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.65);
        }

        #xp_contestant_box_1 { left: 256.32px; width: 362.88px; }
        #xp_contestant_box_2 { left: 603.36px; width: 362.88px; }
        #xp_contestant_box_3 { left: 953.28px; width: 362.88px; }
        #xp_contestant_box_4 { left: 1304.64px; width: 358.56px; }

        .xp-ts-name {
            flex: 1;
            min-width: 0;
            text-align: left;
            font-family: 'UTM Avo', 'Montserrat', 'MyriadProSemibold', 'Segoe UI', Arial, sans-serif;
            font-size: 28px;
            font-weight: 600;
            line-height: 1.15;
            letter-spacing: 0.2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: #ffffff;
        }

        .xp-ts-score {
            flex-shrink: 0;
            text-align: right;
            font-family: 'UTM Avo', 'Montserrat', 'MyriadProSemibold', 'Segoe UI', Arial, sans-serif;
            font-size: 28px;
            font-weight: 600;
            line-height: 1.1;
            font-variant-numeric: tabular-nums;
            color: #ffffff;
        }

        #xp_question_box {
            position: absolute;
            left: 270.72px;
            top: 818.60px;
            width: 1397.48px;
            height: 169.16px;
            z-index: 30;
            display: flex;
            align-items: flex-start;
            justify-content: flex-start;
            padding: 16px 36px;
            opacity: 0;
            transition: opacity 0.35s ease;
            pointer-events: none;
        }

        #xp_question_text {
            width: 100%;
            color: #ffffff;
            font-family: 'UTM Avo', 'Montserrat', 'MyriadProSemibold', 'Segoe UI', Arial, sans-serif;
            font-size: 28px;
            font-weight: 600;
            line-height: 1.32;
            text-align: left;
            text-shadow: 0 2px 6px rgba(0, 0, 0, 0.75);
            word-break: break-word;
            overflow: hidden;
        }

        /* Intro Media Overlay */
        #intro_video_overlay {
            position: absolute;
            inset: 0;
            width: 1920px;
            height: 1080px;
            background: #000000;
            z-index: 80;
            display: none;
            align-items: center;
            justify-content: center;
        }

        #intro_video_player,
        #intro_image_player {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: none;
        }

        /* Summary Overlay */
        #summary_overlay {
            position: absolute;
            inset: 0;
            width: 1920px;
            height: 1080px;
            background: rgba(6, 20, 48, 0.94);
            z-index: 90;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 80px 160px;
            color: #ffffff;
        }

        .summary-title {
            font-size: 60px;
            font-weight: 600;
            letter-spacing: 2px;
            color: #facc15;
            margin-bottom: 48px;
            text-transform: uppercase;
            text-shadow: 0 4px 16px rgba(0, 0, 0, 0.6);
        }

        .summary-grid {
            width: 100%;
            max-width: 1320px;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .summary-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 26px 42px;
            border-radius: 14px;
            background: linear-gradient(90deg, rgba(16, 55, 115, 0.92), rgba(10, 34, 78, 0.92));
            border: 2px solid rgba(96, 165, 250, 0.45);
            box-shadow: 0 12px 28px rgba(0, 0, 0, 0.35);
        }

        .summary-name {
            font-size: 38px;
            font-weight: 600;
            color: #ffffff;
        }

        .summary-score {
            font-size: 46px;
            font-weight: 600;
            color: #facc15;
            font-variant-numeric: tabular-nums;
        }

        /* Autoplay Audio Unlock Banner (only shown if browser blocks audio playback) */
        #audio_unlock_banner {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 9999;
            background: rgba(15, 23, 42, 0.92);
            color: #facc15;
            border: 2px solid #facc15;
            border-radius: 10px;
            padding: 12px 20px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            display: none;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
        }
    </style>
</head>
<body>
    <button id="audio_unlock_banner" type="button" onclick="unlockProjectorAudio()">
        Nhấn vào đây để bật âm thanh Máy Chiếu
    </button>

    <div id="stage-wrapper">
        <!-- Round 1: Khởi Động -->
        <div id="view-file-1" class="projector-scene active">
            <video id="xp_showques_video" src="/Media/1_showques_4P.mp4" muted playsinline preload="auto"></video>

            <div id="xp_highlight_1" class="xp-highlight"><img src="/Media/1.s1.png" alt="Highlight 1"></div>
            <div id="xp_highlight_2" class="xp-highlight"><img src="/Media/1.s2.png" alt="Highlight 2"></div>
            <div id="xp_highlight_3" class="xp-highlight"><img src="/Media/1.s3.png" alt="Highlight 3"></div>
            <div id="xp_highlight_4" class="xp-highlight"><img src="/Media/1.s4.png" alt="Highlight 4"></div>

            <div id="xp_contestant_box_1" class="xp-contestant-box">
                <span id="xp_ts_name_1" class="xp-ts-name">1. Thí sinh 1</span>
                <span id="xp_ts_score_1" class="xp-ts-score">0</span>
            </div>
            <div id="xp_contestant_box_2" class="xp-contestant-box">
                <span id="xp_ts_name_2" class="xp-ts-name">2. Thí sinh 2</span>
                <span id="xp_ts_score_2" class="xp-ts-score">0</span>
            </div>
            <div id="xp_contestant_box_3" class="xp-contestant-box">
                <span id="xp_ts_name_3" class="xp-ts-name">3. Thí sinh 3</span>
                <span id="xp_ts_score_3" class="xp-ts-score">0</span>
            </div>
            <div id="xp_contestant_box_4" class="xp-contestant-box">
                <span id="xp_ts_name_4" class="xp-ts-name">4. Thí sinh 4</span>
                <span id="xp_ts_score_4" class="xp-ts-score">0</span>
            </div>

            <div id="xp_question_box">
                <div id="xp_question_text"></div>
            </div>
        </div>

        <!-- Intro Video / Image Overlay -->
        <div id="intro_video_overlay">
            <video id="intro_video_player" playsinline preload="auto"></video>
            <img id="intro_image_player" alt="Intro Media">
        </div>

        <!-- Summary Scoreboard Overlay -->
        <div id="summary_overlay">
            <div class="summary-title">Tổng Kết Điểm</div>
            <div class="summary-grid">
                <div class="summary-row">
                    <span id="summary_ts1" class="summary-name">1. Thí sinh 1</span>
                    <span id="summary_d1" class="summary-score">0</span>
                </div>
                <div class="summary-row">
                    <span id="summary_ts2" class="summary-name">2. Thí sinh 2</span>
                    <span id="summary_d2" class="summary-score">0</span>
                </div>
                <div class="summary-row">
                    <span id="summary_ts3" class="summary-name">3. Thí sinh 3</span>
                    <span id="summary_d3" class="summary-score">0</span>
                </div>
                <div class="summary-row">
                    <span id="summary_ts4" class="summary-name">4. Thí sinh 4</span>
                    <span id="summary_d4" class="summary-score">0</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        window.CURRENT_ROLE = 'projector';

        // Viewport scaling (1920x1080 aspect-fit)
        function scaleStage() {
            const stage = document.getElementById('stage-wrapper');
            if (!stage) return;
            const scale = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
            stage.style.transform = `scale(${scale})`;
        }
        window.addEventListener('resize', scaleStage);
        window.addEventListener('DOMContentLoaded', scaleStage);
        scaleStage();

        // Audio Settings
        const audioSettings = {
            enabled: true,
            volume: 1.0
        };

        try {
            const savedAudio = localStorage.getItem('ddvq_audio_settings');
            if (savedAudio) {
                const parsed = JSON.parse(savedAudio);
                if (typeof parsed.projectorEnabled === 'boolean') audioSettings.enabled = parsed.projectorEnabled;
                if (typeof parsed.projectorVolume === 'number') audioSettings.volume = Math.max(0, Math.min(1, parsed.projectorVolume / 100));
            }
        } catch (e) {}

        // Preload Round 1 SFX
        const SFX_PATHS = {
            startRound: '/SFX/1_StartRound.mp3',
            pStart: '/SFX/1_PStart.mp3',
            showQues: '/SFX/1_StartStartQuestionShow.mp3',
            buzz: '/SFX/1_buzz.mp3',
            loop1: '/SFX/1_thinking_O10_loop_1.mp3',
            loop2: '/SFX/1_thinking_O10_loop_2.mp3',
            loop3: '/SFX/1_thinking_O10_loop_3.mp3',
            loop4: '/SFX/1_thinking_O10_loop_4.mp3',
            finish: '/SFX/1_Finish.mp3',
            right: '/SFX/1_Right.mp3',
            wrong: '/SFX/1_Wrong.mp3'
        };

        const sfxBank = {};
        Object.keys(SFX_PATHS).forEach(key => {
            const a = new Audio(SFX_PATHS[key]);
            a.preload = 'auto';
            if (key === 'loop1' || key === 'loop2' || key === 'loop3') {
                a.loop = true;
            }
            sfxBank[key] = a;
        });

        let pendingBlockedAudio = null;

        function unlockProjectorAudio() {
            const banner = document.getElementById('audio_unlock_banner');
            if (banner) banner.style.display = 'none';
            if (pendingBlockedAudio) {
                const { key, loop } = pendingBlockedAudio;
                pendingBlockedAudio = null;
                playSfx(key, { loop });
            } else {
                // Silent touch unlock across bank
                Object.values(sfxBank).forEach(a => {
                    try {
                        if (a.paused) {
                            a.load();
                        }
                    } catch (e) {}
                });
            }
        }
        window.unlockProjectorAudio = unlockProjectorAudio;

        document.addEventListener('pointerdown', () => {
            if (pendingBlockedAudio) unlockProjectorAudio();
        }, { passive: true });

        function applyVolumeAll() {
            const vol = audioSettings.enabled ? audioSettings.volume : 0;
            Object.values(sfxBank).forEach(a => {
                a.volume = vol;
            });
            const introVid = document.getElementById('intro_video_player');
            if (introVid) introVid.volume = vol;
        }

        function stopAudioItem(audio) {
            if (!audio) return;
            try {
                audio.pause();
                audio.currentTime = 0;
            } catch (e) {}
        }

        function playSfx(key, options = {}) {
            const audio = sfxBank[key];
            if (!audio) return;
            if (!audioSettings.enabled) return;

            try {
                if (typeof options.loop === 'boolean') {
                    audio.loop = options.loop;
                }
                audio.volume = audioSettings.volume;
                if (audio.readyState > 0 && audio.currentTime !== 0) {
                    audio.currentTime = 0;
                }
                const p = audio.play();
                if (p && typeof p.catch === 'function') {
                    p.catch(err => {
                        if (err && err.name === 'NotAllowedError') {
                            pendingBlockedAudio = { key, loop: !!audio.loop };
                            const banner = document.getElementById('audio_unlock_banner');
                            if (banner) banner.style.display = 'block';
                        }
                    });
                }
            } catch (e) {}
        }

        function stopThinkingLoops() {
            stopAudioItem(sfxBank.loop1);
            stopAudioItem(sfxBank.loop2);
            stopAudioItem(sfxBank.loop3);
            stopAudioItem(sfxBank.loop4);
            activeThinkingLoop = 0;
        }

        function stopAllRound1Audio() {
            stopThinkingLoops();
            stopAudioItem(sfxBank.startRound);
            stopAudioItem(sfxBank.pStart);
            stopAudioItem(sfxBank.showQues);
            stopAudioItem(sfxBank.buzz);
            stopAudioItem(sfxBank.finish);
            stopAudioItem(sfxBank.right);
            stopAudioItem(sfxBank.wrong);
            pendingBlockedAudio = null;
        }

        // Round 1 State
        let r1Contestants = [
            { name: 'Thí sinh 1', score: 0 },
            { name: 'Thí sinh 2', score: 0 },
            { name: 'Thí sinh 3', score: 0 },
            { name: 'Thí sinh 4', score: 0 }
        ];
        let activeTurnIndex = 0;
        let xpFastestWinner = 0;
        let xpBuzzerOpen = false;
        let activeThinkingLoop = 0;
        let isRound1GraphicsShown = false;
        let isRound1MetaRevealed = false;
        let qTextRevealTimer = null;
        let metaRevealTimer = null;

        const showQuesVideo = document.getElementById('xp_showques_video');
        if (showQuesVideo) {
            // Ensure video stays paused on its final frame once completed
            showQuesVideo.addEventListener('ended', () => {
                try {
                    showQuesVideo.pause();
                } catch (e) {}
            });
        }

        function clearRound1Timers() {
            if (qTextRevealTimer) {
                clearTimeout(qTextRevealTimer);
                qTextRevealTimer = null;
            }
            if (metaRevealTimer) {
                clearTimeout(metaRevealTimer);
                metaRevealTimer = null;
            }
        }

        function syncContestantsData(list) {
            if (!Array.isArray(list)) return;
            for (let i = 0; i < 4; i++) {
                if (list[i]) {
                    r1Contestants[i] = {
                        name: (list[i].name && String(list[i].name).trim()) ? String(list[i].name).trim() : `Thí sinh ${i + 1}`,
                        score: Number.isFinite(Number(list[i].score)) ? Number(list[i].score) : 0
                    };
                }
            }
            renderContestantsUI();
        }

        function renderContestantsUI() {
            for (let i = 1; i <= 4; i++) {
                const item = r1Contestants[i - 1] || { name: `Thí sinh ${i}`, score: 0 };
                const nameEl = document.getElementById(`xp_ts_name_${i}`);
                const scoreEl = document.getElementById(`xp_ts_score_${i}`);
                if (nameEl) nameEl.textContent = `${i}. ${item.name}`;
                if (scoreEl) scoreEl.textContent = `${item.score ?? 0}`;

                const sumName = document.getElementById(`summary_ts${i}`);
                const sumScore = document.getElementById(`summary_d${i}`);
                if (sumName) sumName.textContent = `${i}. ${item.name}`;
                if (sumScore) sumScore.textContent = `${item.score ?? 0}`;
            }
        }

        function updateActiveHighlight(turnIdx) {
            for (let i = 1; i <= 4; i++) {
                const hl = document.getElementById(`xp_highlight_${i}`);
                if (!hl) continue;
                if (isRound1MetaRevealed && turnIdx === i) {
                    hl.style.opacity = '1';
                } else {
                    hl.style.opacity = '0';
                }
            }
        }

        function setContestantBoxesVisible(visible) {
            for (let i = 1; i <= 4; i++) {
                const box = document.getElementById(`xp_contestant_box_${i}`);
                if (box) {
                    box.style.opacity = visible ? '1' : '0';
                }
            }
        }

        function setQuestionText(text) {
            const box = document.getElementById('xp_question_box');
            const textEl = document.getElementById('xp_question_text');
            if (!textEl || !box) return;

            const cleanText = (text || '').toString().trim();
            textEl.textContent = cleanText;

            const len = cleanText.length;
            if (len > 360) {
                textEl.style.fontSize = '22px';
                textEl.style.lineHeight = '1.25';
            } else if (len > 260) {
                textEl.style.fontSize = '25px';
                textEl.style.lineHeight = '1.28';
            } else {
                textEl.style.fontSize = '28px';
                textEl.style.lineHeight = '1.32';
            }
        }

        function hideAllRound1Graphics() {
            clearRound1Timers();
            isRound1GraphicsShown = false;
            isRound1MetaRevealed = false;

            if (showQuesVideo) {
                showQuesVideo.style.opacity = '0';
                try {
                    showQuesVideo.pause();
                    showQuesVideo.currentTime = 0;
                } catch (e) {}
            }

            updateActiveHighlight(0);
            setContestantBoxesVisible(false);

            const qBox = document.getElementById('xp_question_box');
            const qText = document.getElementById('xp_question_text');
            if (qBox) qBox.style.opacity = '0';
            if (qText) qText.textContent = '';
        }

        function computeTargetThinkingLoop(questionIndex, totalQuestions) {
            const q = Math.max(1, parseInt(questionIndex, 10) || 1);
            const total = Math.max(1, parseInt(totalQuestions, 10) || 6);

            if (total <= 6) {
                if (q >= 6) return 4;
                if (q >= 5) return 3;
                if (q >= 3) return 2;
                return 1;
            }

            if (total === 12) {
                if (q >= 12) return 4;
                if (q === 11) return 3;
                if (q >= 6) return 2;
                return 1;
            }

            const loop4At = total;
            const loop3At = Math.max(2, total - 1);
            const loop2At = Math.max(2, Math.floor((total - 2) / 2) + 1);

            if (q >= loop4At) return 4;
            if (q >= loop3At) return 3;
            if (q >= loop2At) return 2;
            return 1;
        }

        function playThinkingLoopForQuestion(questionIndex, totalQuestions, forceRestart = false) {
            const targetLoop = computeTargetThinkingLoop(questionIndex, totalQuestions);
            if (!forceRestart && activeThinkingLoop === targetLoop) {
                return;
            }
            stopThinkingLoops();
            activeThinkingLoop = targetLoop;
            const loopKey = `loop${targetLoop}`;
            const shouldLoop = targetLoop < 4;
            playSfx(loopKey, { loop: shouldLoop });
        }

        function handleShowGraphicCauHoi(data) {
            clearRound1Timers();
            if (data.contestants) syncContestantsData(data.contestants);
            if (data.turnIndex !== undefined) {
                activeTurnIndex = parseInt(data.turnIndex, 10) || activeTurnIndex;
            }

            // Hide previous highlight/meta/question box before animation plays
            isRound1GraphicsShown = true;
            isRound1MetaRevealed = false;
            xpFastestWinner = 0;
            xpBuzzerOpen = false;
            updateActiveHighlight(0);
            setContestantBoxesVisible(false);

            const qBox = document.getElementById('xp_question_box');
            if (qBox) qBox.style.opacity = '0';
            setQuestionText('');

            // Stop previous sounds (StartRound, PStart, Finish, old thinking loops)
            stopAudioItem(sfxBank.startRound);
            stopAudioItem(sfxBank.pStart);
            stopAudioItem(sfxBank.finish);
            stopThinkingLoops();

            // Play Question Show SFX + ShowQues Video (do NOT play thinking loop or reveal Q1 yet)
            playSfx('showQues', { loop: false });

            if (showQuesVideo) {
                showQuesVideo.style.opacity = '1';
                try {
                    showQuesVideo.currentTime = 0;
                    const vp = showQuesVideo.play();
                    if (vp && typeof vp.catch === 'function') vp.catch(() => {});
                } catch (e) {}
            }

            // After 2.5s, fade in contestant names + scores; in Turns 1..4 show active turn highlight, in Turn 5 wait until fastest buzz
            metaRevealTimer = setTimeout(() => {
                if (!isRound1GraphicsShown) return;
                isRound1MetaRevealed = true;
                renderContestantsUI();
                if (activeTurnIndex >= 1 && activeTurnIndex <= 4) {
                    updateActiveHighlight(activeTurnIndex);
                } else {
                    updateActiveHighlight(xpFastestWinner || 0);
                }
                setContestantBoxesVisible(true);
            }, 2500);
        }

        function handleHienCauHoi(data) {
            if (data.contestants) syncContestantsData(data.contestants);
            if (data.turnIndex !== undefined) {
                activeTurnIndex = parseInt(data.turnIndex, 10) || activeTurnIndex;
            }
            isRound1GraphicsShown = true;
            xpFastestWinner = 0;
            xpBuzzerOpen = (activeTurnIndex === 5);

            if (activeTurnIndex === 5) {
                updateActiveHighlight(0);
            } else if (isRound1MetaRevealed && activeTurnIndex >= 1 && activeTurnIndex <= 4) {
                updateActiveHighlight(activeTurnIndex);
            }

            const qText = data.questionText || '';
            setQuestionText(qText);

            const qBox = document.getElementById('xp_question_box');
            if (qBox) {
                qBox.style.opacity = '1';
            }

            const defaultTotal = activeTurnIndex === 5 ? 12 : 6;
            const totalQ = parseInt(data.totalQuestions, 10) || defaultTotal;
            const qIdx = parseInt(data.questionIndex, 10) || 1;
            playThinkingLoopForQuestion(qIdx, totalQ, true);
        }

        function handleNextQuestion(data) {
            if (data.contestants) syncContestantsData(data.contestants);
            if (data.turnIndex !== undefined) {
                activeTurnIndex = parseInt(data.turnIndex, 10) || activeTurnIndex;
            }
            xpFastestWinner = 0;
            xpBuzzerOpen = (activeTurnIndex === 5);
            if (activeTurnIndex === 5) {
                updateActiveHighlight(0);
            }

            const qText = data.questionText || '';
            setQuestionText(qText);

            const qBox = document.getElementById('xp_question_box');
            if (qBox) {
                qBox.style.opacity = '1';
            }

            const defaultTotal = activeTurnIndex === 5 ? 12 : 6;
            const totalQ = parseInt(data.totalQuestions, 10) || defaultTotal;
            const qIdx = parseInt(data.questionIndex, 10) || 1;
            playThinkingLoopForQuestion(qIdx, totalQ, false);
        }

        function handleXuatPhatFastestBuzz(buzzedId, forceFromController = false) {
            const id = parseInt(buzzedId, 10) || 0;
            if (id < 1 || id > 4) return;
            if (xpFastestWinner !== 0) return;
            if (!forceFromController && (activeTurnIndex !== 5 || !xpBuzzerOpen)) return;

            activeTurnIndex = 5;
            xpFastestWinner = id;
            xpBuzzerOpen = false;
            isRound1GraphicsShown = true;
            isRound1MetaRevealed = true;
            setContestantBoxesVisible(true);
            updateActiveHighlight(id);
            playSfx('buzz', { loop: false });
        }

        function handleIntroPlay(data) {
            const overlay = document.getElementById('intro_video_overlay');
            const vid = document.getElementById('intro_video_player');
            const img = document.getElementById('intro_image_player');
            if (!overlay || !vid || !img) return;

            const src = data.src || '';
            if (!src) return;

            overlay.style.display = 'flex';
            if (data.mediaType === 'image') {
                vid.style.display = 'none';
                try { vid.pause(); } catch (e) {}
                img.src = src;
                img.style.display = 'block';
            } else {
                img.style.display = 'none';
                vid.src = src;
                vid.style.display = 'block';
                vid.volume = audioSettings.enabled ? audioSettings.volume : 0;
                try {
                    vid.currentTime = 0;
                    const vp = vid.play();
                    if (vp && typeof vp.catch === 'function') vp.catch(() => {});
                } catch (e) {}
            }
        }

        function handleIntroStop() {
            const overlay = document.getElementById('intro_video_overlay');
            const vid = document.getElementById('intro_video_player');
            const img = document.getElementById('intro_image_player');
            if (vid) {
                try {
                    vid.pause();
                    vid.currentTime = 0;
                    vid.removeAttribute('src');
                } catch (e) {}
                vid.style.display = 'none';
            }
            if (img) {
                img.style.display = 'none';
                img.removeAttribute('src');
            }
            if (overlay) overlay.style.display = 'none';
        }

        function handleToggleSummary(data) {
            if (data.contestants) syncContestantsData(data.contestants);
            const overlay = document.getElementById('summary_overlay');
            if (overlay) {
                overlay.style.display = data.show ? 'flex' : 'none';
            }
        }

        // Message Deduplication across WS / BroadcastChannel / Storage / postMessage
        const seenActionKeys = new Map();
        function isDuplicateMessage(data) {
            if (!data || !data.type) return true;
            const key = data._msgId || data.id || `${data.type}_${data.timestamp || data._timestamp || ''}`;
            if (!key) return false;
            const now = Date.now();
            if (seenActionKeys.size > 200) {
                for (const [k, t] of seenActionKeys.entries()) {
                    if (now - t > 10000) seenActionKeys.delete(k);
                }
            }
            if (seenActionKeys.has(key)) return true;
            seenActionKeys.set(key, now);
            return false;
        }

        function handleProjectorMessage(data) {
            if (!data || typeof data !== 'object') return;
            if (isDuplicateMessage(data)) return;

            const type = data.type;

            switch (type) {
                case 'START_ROUND_CLEAN': {
                    handleIntroStop();
                    const summaryEl = document.getElementById('summary_overlay');
                    if (summaryEl) summaryEl.style.display = 'none';
                    if (data.contestants) syncContestantsData(data.contestants);
                    if (data.roundIndex === 1 || data.round === 'XUAT_PHAT' || data.activeRound === 'XUAT_PHAT') {
                        activeTurnIndex = 0;
                        xpFastestWinner = 0;
                        xpBuzzerOpen = false;
                        hideAllRound1Graphics();
                        stopAllRound1Audio();
                        playSfx('startRound', { loop: false });
                    }
                    break;
                }

                case 'XUAT_PHAT_RESET': {
                    if (data.contestants) syncContestantsData(data.contestants);
                    activeTurnIndex = parseInt(data.turnIndex, 10) || 0;
                    xpFastestWinner = 0;
                    xpBuzzerOpen = false;
                    hideAllRound1Graphics();
                    if (!data.keepRoundStartSound) {
                        stopAllRound1Audio();
                    }
                    break;
                }

                case 'XUAT_PHAT_PSTART': {
                    if (data.contestants) syncContestantsData(data.contestants);
                    if (data.turnIndex) {
                        activeTurnIndex = parseInt(data.turnIndex, 10) || activeTurnIndex;
                    }
                    stopAudioItem(sfxBank.startRound);
                    stopThinkingLoops();
                    playSfx('pStart', { loop: false });
                    break;
                }

                case 'XUAT_PHAT_SELECT_CONTESTANT': {
                    if (data.contestants) syncContestantsData(data.contestants);
                    if (data.turnIndex) {
                        activeTurnIndex = parseInt(data.turnIndex, 10) || 0;
                    }
                    xpFastestWinner = 0;
                    xpBuzzerOpen = false;
                    if (isRound1MetaRevealed) {
                        updateActiveHighlight(activeTurnIndex);
                    }
                    break;
                }

                case 'XUAT_PHAT_SELECT_CHUNG': {
                    if (data.contestants) syncContestantsData(data.contestants);
                    activeTurnIndex = 5;
                    xpFastestWinner = 0;
                    xpBuzzerOpen = false;
                    if (isRound1MetaRevealed) {
                        updateActiveHighlight(0);
                    }
                    break;
                }

                case 'XUAT_PHAT_SHOW_GRAPHIC_CAU_HOI': {
                    handleIntroStop();
                    const summaryEl = document.getElementById('summary_overlay');
                    if (summaryEl) summaryEl.style.display = 'none';
                    handleShowGraphicCauHoi(data);
                    break;
                }

                case 'XUAT_PHAT_HIEN_CAU_HOI':
                case 'XUAT_PHAT_BAT_DAU_CAU_HOI': {
                    handleIntroStop();
                    const summaryEl = document.getElementById('summary_overlay');
                    if (summaryEl) summaryEl.style.display = 'none';
                    handleHienCauHoi(data);
                    break;
                }

                case 'XUAT_PHAT_NEXT_QUESTION': {
                    handleNextQuestion(data);
                    break;
                }

                case 'PLAYER_RING_BELL':
                case 'RING_BELL': {
                    const r = (data.round || '').toString().toUpperCase();
                    if (r === 'KD' || r === 'XUAT_PHAT' || r === 'KHOI_DONG' || r === 'XP' || (!r && activeTurnIndex === 5)) {
                        const winner = data.winnerId || data.contestantId || data.contestantIndex;
                        handleXuatPhatFastestBuzz(winner, false);
                    }
                    break;
                }

                case 'XUAT_PHAT_SHOW_FASTEST_HL': {
                    const winner = data.contestantIndex || data.whoBuzzed || data.contestantId || data.winnerId;
                    handleXuatPhatFastestBuzz(winner, true);
                    break;
                }

                case 'UNLOCK_BELLS': {
                    if (activeTurnIndex === 5 || parseInt(data.turnIndex, 10) === 5) {
                        activeTurnIndex = 5;
                        xpFastestWinner = 0;
                        xpBuzzerOpen = true;
                        updateActiveHighlight(0);
                    }
                    break;
                }

                case 'LOCK_BELLS': {
                    if (activeTurnIndex === 5) {
                        xpBuzzerOpen = false;
                        const winner = data.contestantIndex || data.whoBuzzed || data.contestantId;
                        if (winner && xpFastestWinner === 0) {
                            handleXuatPhatFastestBuzz(winner, true);
                        }
                    }
                    break;
                }

                case 'XUAT_PHAT_RIGHT': {
                    if (data.contestants) {
                        syncContestantsData(data.contestants);
                    } else {
                        const targetTs = parseInt(data.targetContestantId || data.contestantId || data.turnIndex, 10);
                        if (targetTs >= 1 && targetTs <= 4 && data.score !== undefined && r1Contestants[targetTs - 1]) {
                            r1Contestants[targetTs - 1].score = Number(data.score) || 0;
                            renderContestantsUI();
                        }
                    }
                    if (activeTurnIndex === 5) xpBuzzerOpen = false;
                    playSfx('right', { loop: false });
                    break;
                }

                case 'XUAT_PHAT_WRONG': {
                    if (data.contestants) {
                        syncContestantsData(data.contestants);
                    } else {
                        const targetTs = parseInt(data.targetContestantId || data.contestantId || data.turnIndex, 10);
                        if (targetTs >= 1 && targetTs <= 4 && data.score !== undefined && r1Contestants[targetTs - 1]) {
                            r1Contestants[targetTs - 1].score = Number(data.score) || 0;
                            renderContestantsUI();
                        }
                    }
                    if (activeTurnIndex === 5) xpBuzzerOpen = false;
                    playSfx('wrong', { loop: false });
                    break;
                }

                case 'XUAT_PHAT_FINISH': {
                    xpFastestWinner = 0;
                    xpBuzzerOpen = false;
                    hideAllRound1Graphics();
                    stopThinkingLoops();
                    stopAudioItem(sfxBank.showQues);
                    stopAudioItem(sfxBank.pStart);
                    stopAudioItem(sfxBank.startRound);
                    stopAudioItem(sfxBank.buzz);
                    playSfx('finish', { loop: false });
                    break;
                }

                case 'XUAT_PHAT_STOP_SOUND':
                case 'STOP_SOUND': {
                    stopAllRound1Audio();
                    break;
                }

                case 'UPDATE_SCORES':
                case 'UPDATE_CONTESTANTS':
                case 'SYNC_GAME_DATA':
                case 'FULL_STATE_SYNC': {
                    if (data.contestants) syncContestantsData(data.contestants);
                    else if (data.gameData && data.gameData.contestants) syncContestantsData(data.gameData.contestants);
                    break;
                }

                case 'PLAY_INTRO_VIDEO': {
                    handleIntroPlay(data);
                    break;
                }

                case 'STOP_INTRO_VIDEO': {
                    handleIntroStop();
                    break;
                }

                case 'TOGGLE_SUMMARY': {
                    handleToggleSummary(data);
                    break;
                }

                case 'UPDATE_AUDIO_SETTINGS': {
                    if (data.audioSettings) {
                        audioSettings.enabled = data.audioSettings.projectorEnabled !== false;
                        audioSettings.volume = typeof data.audioSettings.projectorVolume === 'number'
                            ? Math.max(0, Math.min(1, data.audioSettings.projectorVolume / 100))
                            : 1.0;
                        applyVolumeAll();
                    }
                    break;
                }

                case 'RESET_ALL_DATA': {
                    activeTurnIndex = 0;
                    hideAllRound1Graphics();
                    stopAllRound1Audio();
                    r1Contestants = [
                        { name: 'Thí sinh 1', score: 0 },
                        { name: 'Thí sinh 2', score: 0 },
                        { name: 'Thí sinh 3', score: 0 },
                        { name: 'Thí sinh 4', score: 0 }
                    ];
                    renderContestantsUI();
                    break;
                }

                case 'RELOAD_CLIENT': {
                    if (data.target === 'all' || data.target === 'projector' || data.role === 'projector') {
                        window.location.reload();
                    }
                    break;
                }
            }
        }
        window.handleProjectorMessage = handleProjectorMessage;

        // Multi-channel listeners (BroadcastChannel, localStorage, window.message)
        let projBroadcastChannel = null;
        try {
            projBroadcastChannel = new BroadcastChannel('ddvq_game_channel');
            projBroadcastChannel.onmessage = (event) => {
                if (event && event.data) {
                    handleProjectorMessage(event.data);
                }
            };
        } catch (e) {}

        window.addEventListener('storage', (event) => {
            if (!event) return;
            if (event.key === 'ddvq_latest_action' && event.newValue) {
                try {
                    const parsed = JSON.parse(event.newValue);
                    handleProjectorMessage(parsed);
                } catch (e) {}
            } else if (event.key === 'duong_den_vinh_quang_data' && event.newValue) {
                try {
                    const parsed = JSON.parse(event.newValue);
                    if (parsed && parsed.contestants) syncContestantsData(parsed.contestants);
                } catch (e) {}
            }
        });

        window.addEventListener('message', (event) => {
            if (event && event.data && typeof event.data === 'object') {
                handleProjectorMessage(event.data);
            }
        });

        // Initial State Hydration from localStorage and /api/state
        function hydrateInitialProjectorState() {
            try {
                const rawGameData = localStorage.getItem('duong_den_vinh_quang_data');
                if (rawGameData) {
                    const parsed = JSON.parse(rawGameData);
                    if (parsed && parsed.contestants) syncContestantsData(parsed.contestants);
                }
            } catch (e) {}

            if (typeof hasLocalServerBackend === 'function' && hasLocalServerBackend()) {
                const apiUrl = typeof getApiUrl === 'function' ? getApiUrl('/api/state') : '/api/state';
                fetch(apiUrl)
                    .then(res => res.json())
                    .then(state => {
                        if (!state) return;
                        if (state.contestants) syncContestantsData(state.contestants);
                        else if (state.gameData && state.gameData.contestants) syncContestantsData(state.gameData.contestants);
                    })
                    .catch(() => {});
            }
        }

        // Presence / Heartbeat so Controller sees Projector Online
        function sendProjectorHeartbeat(isReady = false) {
            const payload = {
                type: isReady ? 'PROJECTOR_READY' : 'CLIENT_HEARTBEAT',
                role: 'projector',
                name: 'Máy Chiếu',
                timestamp: Date.now()
            };
            if (typeof sendSupabaseAction === 'function') {
                try { sendSupabaseAction(payload); } catch (e) {}
            }
            if (projBroadcastChannel) {
                try { projBroadcastChannel.postMessage(payload); } catch (e) {}
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            renderContestantsUI();
            applyVolumeAll();
            hydrateInitialProjectorState();
            setTimeout(() => sendProjectorHeartbeat(true), 250);
            setInterval(() => sendProjectorHeartbeat(false), 5000);
        });
    </script>
</body>
