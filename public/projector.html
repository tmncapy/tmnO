    <script>
        window.CURRENT_ROLE = 'projector';

        // Viewport scaling (1920x1080 aspect-fit)
        function scaleStage() {
            const stage = document.getElementById('stage-wrapper');
            if (!stage) return;
            const scale = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
            stage.style.transform = `scale(${scale})`;

                refitActiveProjectorTexts();

        // Audio Settings

                const parsed = JSON.parse(savedAudio);
                if (typeof parsed.projectorEnabled === 'boolean') audioSettings.enabled = parsed.projectorEnabled;

        const sfxBank = {};
        Object.keys(SFX_PATHS).forEach(key => {
            const a = new Audio(SFX_PATHS[key]);
            a.preload = 'auto';
            if (key === 'loop1' || key === 'loop2' || key === 'loop3') {
                a.loop = true;
            }
            sfxBank[key] = a;
        });

        let pendingBlockedAudio = null;

        function unlockProjectorAudio() {
            if (pendingBlockedAudio) {
                const { key, loop } = pendingBlockedAudio;
                pendingBlockedAudio = null;
                playSfx(key, { loop });
            } else {
                // Silent touch unlock across bank
                Object.values(sfxBank).forEach(a => {
                    try {
                        if (a.paused) {
                            a.load();
                        }
                    } catch (e) {}
                });
            }
        }
        window.unlockProjectorAudio = unlockProjectorAudio;

        document.addEventListener('pointerdown', () => {
            if (pendingBlockedAudio) unlockProjectorAudio();
        }, { passive: true });

        function applyVolumeAll() {
            const vol = audioSettings.enabled ? audioSettings.volume : 0;
            Object.values(sfxBank).forEach(a => {
                a.volume = vol;
            });
            const introVid = document.getElementById('intro_video_player');
            if (introVid) introVid.volume = vol;
            const r3MediaVid = document.getElementById('r3_media_video');
            if (r3MediaVid) {
                r3MediaVid.muted = true;
                r3MediaVid.volume = 0;
            }
        }

        function stopAudioItem(audio) {
            if (!audio) return;
            try {
                audio.pause();
                audio.currentTime = 0;
            } catch (e) {}
        }

        function playSfx(key, options = {}) {
            const audio = sfxBank[key];
            if (!audio) return;
            if (!audioSettings.enabled) return;

            try {
                if (typeof options.loop === 'boolean') {
                    audio.loop = options.loop;
                }
                audio.volume = audioSettings.volume;
                if (audio.readyState > 0 && audio.currentTime !== 0) {
                    audio.currentTime = 0;
                }
                const p = audio.play();
                if (p && typeof p.catch === 'function') {
                    p.catch(err => {
                        if (err && err.name === 'NotAllowedError') {
                            pendingBlockedAudio = { key, loop: !!audio.loop };
                        }
                    });
                }
            } catch (e) {}
        }

        function stopThinkingLoops() {
            stopAudioItem(sfxBank.loop1);
            stopAudioItem(sfxBank.loop2);
            stopAudioItem(sfxBank.loop3);
            stopAudioItem(sfxBank.loop4);
            activeThinkingLoop = 0;
        }

        function stopAllRound2Audio() {
            stopAudioItem(sfxBank.r2StartRound);
            stopAudioItem(sfxBank.r2RowShow);
            stopAudioItem(sfxBank.r2RowChose);

            stopAudioItem(sfxBank.r2OnTime);

            stopAudioItem(sfxBank.r2WrongRow);
            stopAudioItem(sfxBank.r2Activate);
        }

        function stopAllRound3Audio(keepStartRound = false) {
            if (!keepStartRound) {
                stopAudioItem(sfxBank.r3StartRound);
            }
            stopAudioItem(sfxBank.r3Show);
            stopAudioItem(sfxBank.r3Time20);
            stopAudioItem(sfxBank.r3Time30);
            stopAudioItem(sfxBank.r3Answer);
            stopAudioItem(sfxBank.r3Right);
            stopAudioItem(sfxBank.r3Wrong);
        }

        function stopAllRound4Audio(keepStartRound = false) {
            if (!keepStartRound) {
                stopAudioItem(sfxBank.r4StartRound);
            }
            stopAudioItem(sfxBank.r4Player);
            stopAudioItem(sfxBank.r4Show);
            stopAudioItem(sfxBank.r4Pick);
            stopAudioItem(sfxBank.r4Choose);
            stopAudioItem(sfxBank.r4Right);
            stopAudioItem(sfxBank.r4Wrong);
            stopAudioItem(sfxBank.r4Star);
            stopAudioItem(sfxBank.r4Time15);
            stopAudioItem(sfxBank.r4Time20);
            stopAudioItem(sfxBank.r4Other);
            stopAudioItem(sfxBank.r4Chance);
            stopAudioItem(sfxBank.r4Finish);
        }

        function stopAllRound1Audio() {
            stopThinkingLoops();
            stopAudioItem(sfxBank.startRound);
            stopAudioItem(sfxBank.pStart);
            stopAudioItem(sfxBank.showQues);
            stopAudioItem(sfxBank.buzz);
            stopAudioItem(sfxBank.finish);

        }

        function pauseAudioItem(audio) {
            if (!audio) return;
            try {
                audio.pause();
            } catch (e) {}
        }

        function resumeSfx(key) {
            const audio = sfxBank[key];
            if (!audio || !audioSettings.enabled) return;
            try {
                audio.volume = audioSettings.volume;
                const p = audio.play();
                if (p && typeof p.catch === 'function') {
                    p.catch(() => {});
                }
            } catch (e) {}
        }

        function measureUnscaledElementWidth(el, refBox) {
            if (!el) return 0;
            const box = refBox || el.parentElement;
            const prevTransform = el.style.transform;
            el.style.transform = 'none';
            const boxOffsetW = box ? box.offsetWidth : 0;
            const boxRectW = box ? box.getBoundingClientRect().width : 0;
            const stageScale = (boxOffsetW > 0 && boxRectW > 0) ? (boxRectW / boxOffsetW) : 1;
            const rectW = el.getBoundingClientRect().width;
            const width = Math.max(
                el.scrollWidth || 0,
                el.offsetWidth || 0,
                (rectW > 0 && stageScale > 0) ? (rectW / stageScale) : 0
            );
            el.style.transform = prevTransform;
            return width;
        }

        function fitHorizontalScaleText(el, maxWidth, minRatio = 0.2) {
            if (!el) return;
            el.style.transform = 'none';
            if (!(maxWidth > 0)) return;
            const textWidth = measureUnscaledElementWidth(el);
            if (textWidth > maxWidth && textWidth > 0) {
                const ratio = Math.max(minRatio, maxWidth / textWidth);
                el.style.transform = `scaleX(${ratio.toFixed(4)})`;
            }
        }

        function fitQuestionBoxText(boxEl, textEl, baseSize = 28, baseLineHeight = 1.35, minSize = 14) {
            if (!boxEl || !textEl) return;
            let size = baseSize;
            let lh = baseLineHeight;
            textEl.style.fontSize = `${size}px`;
            textEl.style.lineHeight = String(lh);

            const cs = window.getComputedStyle(boxEl);
            if (cs.display === 'none') return;
            const padTop = parseFloat(cs.paddingTop) || 0;
            const padBottom = parseFloat(cs.paddingBottom) || 0;
            const maxHeight = boxEl.clientHeight - padTop - padBottom;
            if (!(maxHeight > 0)) return;

            while (textEl.scrollHeight > maxHeight + 1 && size > minSize) {
                size -= 1;
                if (size < baseSize - 4) {
                    lh = Math.max(1.24, baseLineHeight - (baseSize - size) * 0.01);
                }
                textEl.style.fontSize = `${size}px`;
                textEl.style.lineHeight = lh.toFixed(2);
            }
        }

        function fitRound1ContestantNames() {
            for (let i = 1; i <= 4; i++) {
                const box = document.getElementById(`xp_contestant_box_${i}`);
                const nameEl = document.getElementById(`xp_ts_name_${i}`);
                const scoreEl = document.getElementById(`xp_ts_score_${i}`);
                if (!box || !nameEl) continue;
                const cs = window.getComputedStyle(box);
                const padL = parseFloat(cs.paddingLeft) || 0;
                const padR = parseFloat(cs.paddingRight) || 0;
                const gap = parseFloat(cs.columnGap || cs.gap) || 10;
                const scoreW = scoreEl ? measureUnscaledElementWidth(scoreEl, box) : 0;
                const avail = Math.max(40, box.clientWidth - padL - padR - scoreW - gap - 2);
                fitHorizontalScaleText(nameEl, avail, 0.2);
            }
        }

        function refitActiveProjectorTexts() {
            const s1 = document.getElementById('view-file-1');
            if (s1 && s1.classList.contains('active')) {
                fitRound1ContestantNames();
                const xpBox = document.getElementById('xp_question_box');
                const xpTxt = document.getElementById('xp_question_text');
                if (xpBox && xpTxt && xpTxt.textContent.trim()) {
                    fitQuestionBoxText(xpBox, xpTxt, 28, 1.35, 14);
                }
            }
            const s2 = document.getElementById('view-file-2');
            if (s2 && s2.classList.contains('active')) {
                const cnvBox = document.getElementById('vs_cnv_count_box');
                const cnvTxt = document.getElementById('vs_cnv_count_text');
                if (cnvBox && cnvTxt && cnvBox.style.display !== 'none') {

            const charCount = Array.from(compact).length;

            const onlyDigits = /^[0-9]+$/.test(compact);

            let unit = 'KÝ TỰ';
            if (onlyLetters) {

            } else if (onlyDigits) {
                unit = 'CHỮ SỐ';
            }

            return `CHƯỚNG NGẠI VẬT CÓ ${charCount} ${unit}`;
        }

        function cleanProjectorMediaPath(rawPath) {
            if (!rawPath) return '';
            let clean = String(rawPath).trim();
            if (!clean || clean === '...' || clean === '…' || clean === 'null' || clean === 'undefined') return '';
            if (/^(https?:|blob:|data:)/i.test(clean)) return clean;

            clean = clean.replace(/^file:\/+/i, '').replace(/\\/g, '/');
            const folderMatch = clean.match(/\/(?:public\/)?(uploads|Media|media|SFX|sfx|sounds|Images|images|videos|assets)\/(.+)$/i);
            if (folderMatch) {
                clean = '/' + folderMatch[1] + '/' + folderMatch[2];
            } else if (/^(?:[A-Za-z]:\/|\/(?:Users|home|var|tmp|mnt|app|Desktop|Documents|Downloads)\/)/i.test(clean)) {
                const parts = clean.split('/').filter(Boolean);
                clean = parts.length ? parts[parts.length - 1] : '';
            }
            clean = clean.replace(/^(?:\.\/)+/, '');
            clean = clean.replace(/^\/?(?:public|DuongDenVinhQuang-main)(?=\/)/i, '');
            if (clean.startsWith('./')) clean = clean.slice(2);
            return clean;
        }

        function buildProjectorMediaCandidates(rawUrl) {
            const candidates = [];
            const cleaned = cleanProjectorMediaPath(rawUrl);
            if (!cleaned) return candidates;
            const addCandidate = (u) => {
                if (u && !candidates.includes(u)) candidates.push(u);
            };
            const primary = (typeof getApiUrl === 'function') ? getApiUrl(cleaned) : cleaned;
            addCandidate(primary);
            addCandidate(cleaned);
            if (!/^(https?:|blob:|data:)/i.test(cleaned)) {
                const parts = cleaned.replace(/^\/+/, '').split('/').filter(Boolean);
                const fileName = parts.length ? parts[parts.length - 1] : '';
                if (fileName) {
                    const folders = ['/Media/', '/uploads/', '/Images/', '/videos/', '/assets/', '/'];
                    folders.forEach(prefix => {
                        const raw = prefix + fileName;
                        addCandidate((typeof getApiUrl === 'function') ? getApiUrl(raw) : raw);
                    });
                }
            }
            return candidates;
        }

        function attachProjectorMediaFallback(el, rawUrl, onAllFailed, onLoaded) {
            if (!el) return '';
            const candidates = buildProjectorMediaCandidates(rawUrl);
            if (!candidates.length) {
                el.dataset.fallbackActive = '';
                el.onerror = null;
                el.removeAttribute('src');
                if (typeof onAllFailed === 'function') onAllFailed();
                return '';
            }
            let idx = 0;
            el.dataset.fallbackActive = '1';
            el.onerror = function() {
                idx++;
                if (idx < candidates.length) {
                    const nextUrl = candidates[idx];
                    el.setAttribute('src', nextUrl);
                    if (el.tagName === 'VIDEO') {
                        try { el.load(); if (typeof onLoaded === 'function') onLoaded(el); } catch (e) {}
                    }
                } else {
                    el.dataset.fallbackActive = '';
                    el.onerror = null;
                    if (typeof onAllFailed === 'function') onAllFailed();
                }
            };
            const firstUrl = candidates[0];
            if (el.getAttribute('src') !== firstUrl) {
                el.setAttribute('src', firstUrl);
                if (el.tagName === 'VIDEO') {
                    try { el.load(); } catch (e) {}
                }
            }
            return firstUrl;
        }

        function updateRound2RowGraphics() {

            if (!cells.length) {
                renderRound2Rows(r2VuotSongData);

            }
            const rowCharsCache = {};
            cells.forEach(cellEl => {
                const rowNum = parseInt(cellEl.dataset.row, 10);
                const charIdx = parseInt(cellEl.dataset.charIndex, 10);
                const state = r2RowStates[rowNum] || 'default';
                const targetSrc = getRound2CellSrc(rowNum);
                const img = cellEl.querySelector('.vs-row-cell-img');
                const letterEl = cellEl.querySelector('.vs-row-cell-letter');
                if (img && img.getAttribute('src') !== targetSrc) {
                    img.setAttribute('src', targetSrc);
                }
                if (letterEl) {
                    if (state === 'right') {
                        if (!rowCharsCache[rowNum]) {
                            rowCharsCache[rowNum] = getRound2RowAnswerChars(rowNum, r2VuotSongData);
                        }
                        const ch = rowCharsCache[rowNum][charIdx] || '';
                        letterEl.textContent = ch;
                        letterEl.style.display = ch ? 'flex' : 'none';
                    } else {
                        letterEl.textContent = '';
                        letterEl.style.display = 'none';
                    }
                }
            });

        function renderRound2Rows(vsData) {
            const container = document.getElementById('vs_rows_container');
            if (!container) return;
            const src = vsData || r2VuotSongData || {};

            const rowCharsList = [];
            let hasAnyAnswer = false;
            for (let r = 1; r <= 4; r++) {
                const chars = getRound2RowAnswerChars(r, src);
                if (chars.length > 0) hasAnyAnswer = true;
                rowCharsList.push(chars);
            }

            const frag = document.createDocumentFragment();
            for (let rowIdx = 0; rowIdx < 4; rowIdx++) {
                const rowNum = rowIdx + 1;
                const rowChars = rowCharsList[rowIdx];
                const count = hasAnyAnswer ? rowChars.length : 10;
                if (count <= 0) continue;
                const startCol = 10 - count;
                const topPx = R2_ROW_Y_IN[rowIdx] * PPT_PPI;
                const cellSrc = getRound2CellSrc(rowNum);
                const isRowRight = (r2RowStates[rowNum] === 'right');

                for (let colIdx = startCol; colIdx < 10; colIdx++) {
                    const charIdx = colIdx - startCol;
                    const cellDiv = document.createElement('div');
                    cellDiv.className = 'vs-row-cell';
                    cellDiv.dataset.row = String(rowNum);
                    cellDiv.dataset.charIndex = String(charIdx);
                    cellDiv.style.left = `${(R2_COL_X_IN[colIdx] * PPT_PPI).toFixed(4)}px`;
                    cellDiv.style.top = `${topPx.toFixed(4)}px`;

                    const img = document.createElement('img');
                    img.className = 'vs-row-cell-img';
                    img.src = cellSrc;
                    img.alt = `Ô ${rowIdx * 10 + colIdx + 1}`;
                    cellDiv.appendChild(img);

                    const letterEl = document.createElement('span');
                    letterEl.className = 'vs-row-cell-letter';
                    const ch = isRowRight ? (rowChars[charIdx] || '') : '';
                    if (ch) {
                        letterEl.textContent = ch;
                        letterEl.style.display = 'flex';
                    }
                    cellDiv.appendChild(letterEl);

                    frag.appendChild(cellDiv);
                }
            }
            container.innerHTML = '';
            container.appendChild(frag);
        }

        function detectRound3MediaType(url, explicitType = '') {
            if (explicitType === 'image' || explicitType === 'video') return explicitType;
            const clean = cleanProjectorMediaPath(url);
            if (!clean) return 'none';
            const cleanNoQuery = clean.split(/[?#]/)[0];
            if (clean.startsWith('data:image/') || /\.(png|jpe?g|gif|webp|bmp|svg|avif)$/i.test(cleanNoQuery)) {
                return 'image';
            }
            if (clean.startsWith('data:video/') || /\.(mp4|webm|mov|m4v|avi|mkv|ogv)$/i.test(cleanNoQuery)) {
                return 'video';
            }
            return 'video';
        }

        function normalizeRound3MediaUrl(url) {
            const clean = cleanProjectorMediaPath(url);
            if (!clean) return '';
            if (/^(https?:|blob:|data:)/i.test(clean)) return clean;
            if (typeof getApiUrl === 'function') {
                return getApiUrl(clean);
            }
            if (clean.startsWith('./')) return clean.slice(2);
            return clean.startsWith('/') ? clean : ('/' + clean);
        }

                const fallbackName = (r1Contestants[i] && r1Contestants[i].name) || `Thí sinh ${i + 1}`;
                const pName = (ts.name && String(ts.name).trim())
                    ? String(ts.name).replace(/\s*\(\d+\)/g, '').replace(/\s*\([\d\.]+(?:s|giây|S)?\)/gi, '').trim()
                    : fallbackName;
                const rawAns = ts.answer !== undefined && ts.answer !== null
                    ? ts.answer
                    : (ts.rk_answer !== undefined && ts.rk_answer !== null ? ts.rk_answer : '');
                const ansText = String(rawAns).trim();

                let rawTime = ts.time !== undefined && ts.time !== null
                    ? ts.time
                    : (ts.rk_time !== undefined && ts.rk_time !== null ? ts.rk_time : '');
                rawTime = String(rawTime).replace(/s|giây/gi, '').trim();
                const num = parseFloat(rawTime);
                const hasValidTime = !isNaN(num) && num > 0;
                const formattedTime = !isNaN(num)
                    ? (num < 10 ? '0' + num.toFixed(2) : num.toFixed(2))
                    : '00.00';

                items.push({
                    id: parseInt(ts.id, 10) || (i + 1),
                    name: pName,
                    answer: ansText,
                    time: formattedTime,
                    _sortTime: hasValidTime ? num : (ansText ? (999000 + i) : (999999 + i))

            items.sort((a, b) => a._sortTime - b._sortTime);
            return items;

        function computeTargetThinkingLoop(questionIndex, totalQuestions) {
            const q = Math.max(1, parseInt(questionIndex, 10) || 1);
            const total = Math.max(1, parseInt(totalQuestions, 10) || 6);

            if (total <= 6) {
                if (q >= 6) return 4;
                if (q >= 5) return 3;
                if (q >= 3) return 2;
                return 1;
            }

            if (total === 12) {
                if (q >= 12) return 4;
                if (q === 11) return 3;
                if (q >= 6) return 2;
                return 1;
            }

            const loop4At = total;
            const loop3At = Math.max(2, total - 1);
            const loop2At = Math.max(2, Math.floor((total - 2) / 2) + 1);

            if (q >= loop4At) return 4;
            if (q >= loop3At) return 3;
            if (q >= loop2At) return 2;
            return 1;
        }

            stopThinkingLoops();
            activeThinkingLoop = targetLoop;

        function getSummaryRankedOrder() {
            const items = [];
            for (let i = 0; i < 4; i++) {
                const c = r1Contestants[i] || { name: `Thí sinh ${i + 1}`, score: 0 };
                const cleanName = (c.name || `Thí sinh ${i + 1}`)
                    .toString()
                    .replace(/\s*\(-?\d+\)\s*$/g, '')
                    .trim() || `Thí sinh ${i + 1}`;
                const scoreVal = Number.isFinite(Number(c.score)) ? Number(c.score) : 0;
                items.push({ id: i + 1, name: cleanName, score: scoreVal });
            }
            // Rank 1st -> 4th (highest score first; ties ordered by contestant slot 1..4)
            items.sort((a, b) => (b.score - a.score) || (a.id - b.id));
            // Reveal order: Rank 4 -> Rank 3 -> Rank 2 -> Rank 1
            return [items[3], items[2], items[1], items[0]];
        }

        // Message Deduplication across WS / BroadcastChannel / Storage / postMessage
        const seenActionKeys = new Map();
        function isDuplicateMessage(data) {
            if (!data || !data.type) return true;
            const key = data._msgId || data.id || `${data.type}_${data.timestamp || data._timestamp || ''}`;
            if (!key) return false;
            const now = Date.now();
            if (seenActionKeys.size > 200) {
                for (const [k, t] of seenActionKeys.entries()) {
                    if (now - t > 10000) seenActionKeys.delete(k);
                }
            }
            if (seenActionKeys.has(key)) return true;
            seenActionKeys.set(key, now);
            return false;
        }

        function handleProjectorMessage(data) {
            if (!data || typeof data !== 'object') return;
            if (isDuplicateMessage(data)) return;

            const type = data.type;

            switch (type) {
                case 'START_ROUND_CLEAN': {
                    handleIntroStop();
                    hideSummaryOverlay({ stopAudio: true });
                    if (data.contestants) syncContestantsData(data.contestants);
                    if (data.vuotSong) syncRound2Data(data.vuotSong);

                    if (data.roundIndex === 1 || data.round === 'XUAT_PHAT' || data.activeRound === 'XUAT_PHAT') {
                        switchProjectorScene(1);
                        activeTurnIndex = 0;
                        xpFastestWinner = 0;
                        xpBuzzerOpen = false;
                        hideAllRound1Graphics();
                        hideAllRound2Graphics();
                        hideAllRound3Graphics();
                        stopAllRound1Audio();
                        stopAllRound2Audio();
                        stopAllRound3Audio();
                        playSfx('startRound', { loop: false });
                    } else if (data.roundIndex === 2 || data.round === 'RA_KHOI' || data.activeRound === 'RA_KHOI') {
                        switchProjectorScene(3);
                        activeTurnIndex = 0;
                        xpFastestWinner = 0;
                        xpBuzzerOpen = false;
                        hideAllRound1Graphics();
                        hideAllRound2Graphics();
                        hideAllRound3Graphics();
                        stopAllRound1Audio();
                        stopAllRound2Audio();
                        stopAllRound3Audio();
                        r3LastStartRoundAt = Date.now();
                        playSfx('r3StartRound', { loop: false });
                    } else if (data.roundIndex === 3 || data.round === 'VUOT_SONG' || data.activeRound === 'VUOT_SONG') {
                        switchProjectorScene(2);
                        activeTurnIndex = 0;
                        xpFastestWinner = 0;
                        xpBuzzerOpen = false;
                        hideAllRound1Graphics();
                        hideAllRound2Graphics();
                        hideAllRound3Graphics();
                        hideAllRound4Graphics();
                        stopAllRound1Audio();
                        stopAllRound2Audio();
                        stopAllRound3Audio();
                        stopAllRound4Audio();
                        playSfx('r2StartRound', { loop: false });
                    } else if (data.roundIndex === 4 || data.round === 'VINH_QUANG' || data.activeRound === 'VINH_QUANG') {
                        switchProjectorScene(4);
                        activeTurnIndex = 0;
                        xpFastestWinner = 0;
                        xpBuzzerOpen = false;
                        hideAllRound1Graphics();
                        hideAllRound2Graphics();
                        hideAllRound3Graphics();
                        hideAllRound4Graphics();
                        hideAllRound5Graphics();
                        stopAllRound1Audio();
                        stopAllRound2Audio();
                        stopAllRound3Audio();
                        stopAllRound4Audio();
                        stopAllRound5Audio();
                        r4LastStartRoundAt = Date.now();
                        playSfx('r4StartRound', { loop: false });
                    } else if (data.roundIndex === 5 || data.round === 'CAU_HOI_PHU' || data.activeRound === 'CAU_HOI_PHU') {
                        switchProjectorScene(5);
                        activeTurnIndex = 0;
                        xpFastestWinner = 0;
                        xpBuzzerOpen = false;
                        hideAllRound1Graphics();
                        hideAllRound2Graphics();
                        hideAllRound3Graphics();
                        hideAllRound4Graphics();
                        hideAllRound5Graphics();
                        stopAllRound1Audio();
                        stopAllRound2Audio();
                        stopAllRound3Audio();
                        stopAllRound4Audio();
                        stopAllRound5Audio();
                    }
                    break;
                }

                case 'CAU_HOI_PHU_SHOW_QUESTION': {
                    handleRound5ShowQuestion(data);
                    break;
                }

                case 'CAU_HOI_PHU_START_TIMER': {
                    handleRound5StartTimer(data);
                    break;
                }

                case 'CAU_HOI_PHU_BUZZ': {
                    const buzzTs = data.winnerId || data.contestantId || data.contestantIndex;
                    handleRound5Buzz(buzzTs);
                    break;
                }

                case 'CAU_HOI_PHU_RIGHT': {
                    handleRound5Right(data);
                    break;
                }

                case 'CAU_HOI_PHU_WRONG': {
                    handleRound5Wrong(data);
                    break;
                }

                case 'CAU_HOI_PHU_CONTINUE': {
                    handleRound5Continue(data);
                    break;
                }

                case 'CAU_HOI_PHU_TIMEOUT': {
                    handleRound5Timeout();
                    break;
                }

                case 'CAU_HOI_PHU_RESET': {
                    if (data.contestants) syncContestantsData(data.contestants);
                    switchProjectorScene(5);
                    hideAllRound5Graphics();
                    stopAllRound5Audio();
                    break;
                }

                case 'VINH_QUANG_INTRO': {
                    handleIntroStop();
                    hideSummaryOverlay({ stopAudio: true });
                    if (data.contestants) syncContestantsData(data.contestants);
                    switchProjectorScene(4);
                    hideAllRound1Graphics();
                    hideAllRound2Graphics();
                    hideAllRound3Graphics();
                    hideAllRound4Graphics();
                    stopAllRound1Audio();
                    stopAllRound2Audio();
                    stopAllRound3Audio();
                    if (Date.now() - r4LastStartRoundAt > 800) {
                        stopAllRound4Audio();
                        r4LastStartRoundAt = Date.now();
                        playSfx('r4StartRound', { loop: false });
                    }
                    break;
                }

                case 'VINH_QUANG_SELECT_PLAYER': {
                    if (data.contestants) syncContestantsData(data.contestants);
                    const mc = parseInt(data.contestantIndex || data.mainContestant, 10) || 0;
                    if (mc >= 1 && mc <= 4) {
                        r4MainContestant = mc;
                    }
                    switchProjectorScene(4);
                    if (r4MetaRevealed) {
                        updateRound4MetaUI();
                    }
                    stopAudioItem(sfxBank.r4StartRound);
                    stopAudioItem(sfxBank.r4Player);
                    playSfx('r4Player', { loop: false });
                    break;
                }

                case 'VINH_QUANG_SHOW_PACKS': {
                    handleRound4ShowPacks(data);
                    break;
                }

                case 'VINH_QUANG_PICK_POINT': {
                    handleRound4PickPoint(data);
                    break;
                }

                case 'VINH_QUANG_CHOOSE_PACK': {

        let projBroadcastChannel = null;
        try {
            projBroadcastChannel = new BroadcastChannel('ddvq_game_channel');
            projBroadcastChannel.onmessage = (event) => {
                if (event && event.data) {
                    handleProjectorMessage(event.data);
                }
            };
        } catch (e) {}

        window.addEventListener('storage', (event) => {
            if (!event) return;
            if (event.key === 'ddvq_latest_action' && event.newValue) {
                try {
                    const parsed = JSON.parse(event.newValue);
                    handleProjectorMessage(parsed);
                } catch (e) {}
            } else if (event.key === 'duong_den_vinh_quang_data' && event.newValue) {
                try {
                    const parsed = JSON.parse(event.newValue);
                    if (parsed && parsed.contestants) syncContestantsData(parsed.contestants);
                    if (parsed && parsed.vuotSong) {
                        syncRound2Data(parsed.vuotSong);
                        if (isRound2RowsShown) renderRound2Rows(r2VuotSongData);
                    }
                } catch (e) {}
            }
        });

        window.addEventListener('message', (event) => {
            if (event && event.data && typeof event.data === 'object') {
                handleProjectorMessage(event.data);
            }
        });

        // Initial State Hydration from localStorage and /api/state
        function hydrateInitialProjectorState() {
            try {
                const rawGameData = localStorage.getItem('duong_den_vinh_quang_data');
                if (rawGameData) {
                    const parsed = JSON.parse(rawGameData);
                    if (parsed && parsed.contestants) syncContestantsData(parsed.contestants);
                    if (parsed && parsed.vuotSong) syncRound2Data(parsed.vuotSong);
                }
            } catch (e) {}

            if (typeof hasLocalServerBackend === 'function' && hasLocalServerBackend()) {
                const apiUrl = typeof getApiUrl === 'function' ? getApiUrl('/api/state') : '/api/state';
                fetch(apiUrl)
                    .then(res => res.json())
                    .then(state => {
                        if (!state) return;
                        if (state.contestants) syncContestantsData(state.contestants);
                        else if (state.gameData && state.gameData.contestants) syncContestantsData(state.gameData.contestants);

                        if (state.vuotSongRow !== undefined) {
                            const rowNum = parseInt(state.vuotSongRow, 10);
                            r2SelectedRow = (rowNum >= 1 && rowNum <= 4) ? rowNum : null;
                        }
                        const vs = state.vuotSong || (state.gameData && state.gameData.vuotSong);
                        if (vs) {
                            syncRound2Data(vs);
                            if (isRound2RowsShown) renderRound2Rows(r2VuotSongData);
                        }
                    })
                    .catch(() => {});
            }
        }

        // Presence / Heartbeat so Controller sees Projector Online
        function sendProjectorHeartbeat(isReady = false) {
            const payload = {
                type: isReady ? 'PROJECTOR_READY' : 'CLIENT_HEARTBEAT',
                role: 'projector',
                name: 'Máy Chiếu',
                timestamp: Date.now()
            };
            if (typeof sendSupabaseAction === 'function') {
                try { sendSupabaseAction(payload); } catch (e) {}
            }
            if (projBroadcastChannel) {
                try { projBroadcastChannel.postMessage(payload); } catch (e) {}
            }
        }

        // Transparent Chroma-Key Renderer for green-screen (#13ff08) MP4 overlay videos
        function initChromaKeyOverlayVideos() {
            const videoIds = [
                'r4_showpack_video',
                'r4_showques_video',
                'r4_timer_15s_video',
                'r4_timer_20s_video',
                'r5_timer_15s_video',
                'summary_points_video'
            ];
            const videos = videoIds.map(id => document.getElementById(id)).filter(Boolean);
            if (videos.length === 0) return;

            const glCanvas = document.createElement('canvas');
            glCanvas.width = 1920;
            glCanvas.height = 1080;
            const gl = glCanvas.getContext('webgl', { alpha: true, premultipliedAlpha: true, preserveDrawingBuffer: true })
                || glCanvas.getContext('experimental-webgl', { alpha: true, premultipliedAlpha: true, preserveDrawingBuffer: true });
            if (!gl) return;

            const vsSrc = `
                attribute vec2 a_pos;
                varying vec2 v_uv;
                void main() {
                    v_uv = vec2((a_pos.x + 1.0) * 0.5, 1.0 - (a_pos.y + 1.0) * 0.5);
                    gl_Position = vec4(a_pos, 0.0, 1.0);
                }
            `;
            const fsSrc = `
                precision mediump float;
                uniform sampler2D u_tex;
                varying vec2 v_uv;
                void main() {
                    vec4 c = texture2D(u_tex, v_uv);
                    float maxRB = max(c.r, c.b);
                    float greenness = c.g - maxRB;
                    float alpha = 1.0 - smoothstep(0.14, 0.36, greenness);
                    if (alpha <= 0.01) {
                        gl_FragColor = vec4(0.0, 0.0, 0.0, 0.0);
                        return;
                    }
                    if (alpha < 0.99 && c.g > maxRB) {
                        c.g = mix(c.g, maxRB + 0.02, 1.0 - alpha);
                    }
                    gl_FragColor = vec4(c.rgb * alpha, alpha);
                }
            `;

            function compileShader(type, src) {
                const s = gl.createShader(type);
                gl.shaderSource(s, src);
                gl.compileShader(s);
                if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
                    gl.deleteShader(s);
                    return null;
                }
                return s;
            }

            const vs = compileShader(gl.VERTEX_SHADER, vsSrc);
            const fs = compileShader(gl.FRAGMENT_SHADER, fsSrc);
            if (!vs || !fs) return;

            const prog = gl.createProgram();
            gl.attachShader(prog, vs);
            gl.attachShader(prog, fs);
            gl.linkProgram(prog);
            if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) return;
            gl.useProgram(prog);

            const buf = gl.createBuffer();
            gl.bindBuffer(gl.ARRAY_BUFFER, buf);
            gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
            const posLoc = gl.getAttribLocation(prog, 'a_pos');
            gl.enableVertexAttribArray(posLoc);
            gl.vertexAttribPointer(posLoc, 2, gl.FLOAT, false, 0, 0);

            const tex = gl.createTexture();
            gl.bindTexture(gl.TEXTURE_2D, tex);
            gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
            gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
            gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
            gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);

            const entries = videos.map(video => {
                const canvas = document.createElement('canvas');
                canvas.id = `${video.id}_chroma_canvas`;
                canvas.className = 'chroma-key-canvas';
                canvas.width = 1920;
                canvas.height = 1080;

                const cs = window.getComputedStyle(video);
                canvas.style.zIndex = cs.zIndex || '10';
                canvas.style.display = video.style.display || cs.display || 'none';
                canvas.style.opacity = video.style.opacity || cs.opacity || '1';

                video.parentNode.insertBefore(canvas, video.nextSibling);
                video.classList.add('chroma-key-hidden-video');

                const ctx2d = canvas.getContext('2d', { alpha: true });
                const entry = { video, canvas, ctx2d, dirty: true };

                const syncVisibility = () => {
                    const vDisplay = video.style.display;
                    const vOpacity = video.style.opacity;
                    canvas.style.display = vDisplay !== '' ? vDisplay : 'none';
                    if (vOpacity !== '') canvas.style.opacity = vOpacity;
                    entry.dirty = true;
                    scheduleRender();
                };

                const obs = new MutationObserver(syncVisibility);
                obs.observe(video, { attributes: true, attributeFilter: ['style'] });

                ['loadeddata', 'seeked', 'play', 'playing', 'pause', 'ended'].forEach(evt => {
                    video.addEventListener(evt, () => {
                        entry.dirty = true;
                        scheduleRender();
                    });
                });

                return entry;
            });

            let rafId = null;
            function scheduleRender() {
                if (rafId !== null) return;
                rafId = requestAnimationFrame(renderFrame);
            }

            function renderFrame() {
                rafId = null;
                let keepRunning = false;

                for (const entry of entries) {
                    const { video, canvas, ctx2d } = entry;
                    const scene = video.closest('.projector-scene');
                    const sceneActive = !scene || scene.classList.contains('active');
                    const isVisible = sceneActive && canvas.style.display !== 'none' && canvas.style.opacity !== '0';
                    if (!isVisible) continue;

                    const isPlaying = !video.paused && !video.ended;
                    if (isPlaying) keepRunning = true;
                    if (!isPlaying && !entry.dirty) continue;
                    if (video.readyState < 2) {
                        keepRunning = true;
                        continue;
                    }

                    const vw = video.videoWidth || 1920;
                    const vh = video.videoHeight || 1080;
                    if (glCanvas.width !== vw || glCanvas.height !== vh) {
                        glCanvas.width = vw;
                        glCanvas.height = vh;
                    }
                    if (canvas.width !== vw || canvas.height !== vh) {
                        canvas.width = vw;
                        canvas.height = vh;
                    }

                    gl.viewport(0, 0, vw, vh);
                    gl.clearColor(0, 0, 0, 0);
                    gl.clear(gl.COLOR_BUFFER_BIT);
                    gl.bindTexture(gl.TEXTURE_2D, tex);
                    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, video);
                    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

                    ctx2d.clearRect(0, 0, vw, vh);
                    ctx2d.drawImage(glCanvas, 0, 0, vw, vh);
                    entry.dirty = false;
                }

                if (keepRunning) {
                    scheduleRender();
                }
            }

            // Re-render when scenes switch
            const stageWrapper = document.getElementById('stage-wrapper');
            if (stageWrapper) {
                const sceneObs = new MutationObserver(() => {
                    entries.forEach(e => { e.dirty = true; });
                    scheduleRender();
                });
                sceneObs.observe(stageWrapper, { subtree: true, attributes: true, attributeFilter: ['class'] });
            }

            scheduleRender();
        }

        window.addEventListener('DOMContentLoaded', () => {
            initChromaKeyOverlayVideos();
            renderContestantsUI();
            applyVolumeAll();
            hydrateInitialProjectorState();
            setTimeout(() => sendProjectorHeartbeat(true), 250);
            setInterval(() => sendProjectorHeartbeat(false), 5000);
        });
    </script>
</body>
</html>
