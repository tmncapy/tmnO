<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Màn Hình Chiếu - Đường Lên Đỉnh Olympia</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="designer-runtime.js?v=20261124g"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-sync.js?v=20261124g"></script>
    <style>
        @font-face {
            font-family: 'UTM Avo';
            src: local('UTM Avo'), local('UTMAvo'), local('UTM Avo Regular');
            font-weight: 400;
            font-style: normal;
            font-display: swap;
        }

        @font-face {
            font-family: 'UTM Avo';
            src: local('UTM Avo Bold'), local('UTMAvoBold'), local('UTM Avo'), local('UTMAvo');
            font-weight: 600;
            font-style: normal;
            font-display: swap;
        }

        @font-face {
            font-family: 'UTM Avo';
            src: local('UTM Avo Bold'), local('UTMAvoBold'), local('UTM Avo'), local('UTMAvo');
            font-weight: 700;
            font-style: normal;
            font-display: swap;
        }

        @font-face {
            font-family: 'MyriadProSemibold';
            src: url('/MYRIADPRO-SEMIBOLD.OTF') format('opentype');
            font-weight: 600;
            font-style: normal;
            font-display: swap;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: #000000;
            font-family: 'UTM Avo', 'Montserrat', 'MyriadProSemibold', 'Segoe UI', Arial, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
        }

        #stage-wrapper {
            position: relative;
            width: 1920px;
            height: 1080px;
            transform-origin: center center;
            overflow: hidden;
            background: #13ff08;
            flex-shrink: 0;
        }

        .projector-scene {
            position: absolute;
            inset: 0;
            width: 1920px;
            height: 1080px;
            display: none;
        }

        .projector-scene.active {
            display: block;
        }

        /* Round 1: Khởi Động (#13ff08 matches 1_showques_4P.mp4 chroma key background) */
        #view-file-1 {
            background: #13ff08;
        }

        #xp_showques_video {
            position: absolute;
            left: 0;
            top: 0;
            width: 1920px;
            height: 1080px;
            object-fit: cover;
            z-index: 10;
            opacity: 0;
            pointer-events: none;
        }

        /* Exact PowerPoint 16:9 (13.3333" x 7.5" -> 1920px x 1080px, 1" = 144px) coordinates */
        .xp-highlight {
            position: absolute;
            top: 740.16px;
            height: 59.04px;
            z-index: 20;
            opacity: 0;
            transition: none;
            pointer-events: none;
            overflow: hidden;
        }

        .xp-highlight img {
            width: 100%;
            height: 100%;
            display: block;
            object-fit: fill;
        }

        #xp_highlight_1 { left: 256.32px; width: 362.88px; }
        #xp_highlight_2 { left: 603.36px; width: 362.88px; }
        #xp_highlight_3 { left: 953.28px; width: 362.88px; }
        #xp_highlight_4 { left: 1304.64px; width: 358.56px; }

        .xp-contestant-box {
            position: absolute;
            top: 740.16px;
            height: 59.04px;
            z-index: 30;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            padding: 0 26px;
            opacity: 0;
            transition: none;
            pointer-events: none;
            color: #ffffff;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.65);
        }

        #xp_contestant_box_1 { left: 256.32px; width: 362.88px; }
        #xp_contestant_box_2 { left: 603.36px; width: 362.88px; }
        #xp_contestant_box_3 { left: 953.28px; width: 362.88px; }
        #xp_contestant_box_4 { left: 1304.64px; width: 358.56px; }

        .xp-ts-name {
            flex: 1;
            min-width: 0;
            text-align: left;
            font-family: 'UTM Avo', 'Montserrat', 'MyriadProSemibold', 'Segoe UI', Arial, sans-serif;
            font-size: 28px;
            font-weight: 600;
            line-height: 1.15;
            letter-spacing: 0.2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: #ffffff;
        }

        .xp-ts-score {
            flex-shrink: 0;
            text-align: right;
            font-family: 'UTM Avo', 'Montserrat', 'MyriadProSemibold', 'Segoe UI', Arial, sans-serif;
            font-size: 28px;
            font-weight: 600;
            line-height: 1.1;
            font-variant-numeric: tabular-nums;
            color: #ffffff;
        }

        #xp_question_box {
            position: absolute;
            left: 270.72px;
            top: 818.60px;
            width: 1397.48px;
            height: 169.16px;
            z-index: 30;
            display: flex;
            align-items: flex-start;
            justify-content: flex-start;
            padding: 16px 36px;
            opacity: 0;
            transition: none;
            pointer-events: none;
        }

        #xp_question_text {
            width: 100%;
            color: #ffffff;
            font-family: 'UTM Avo', 'Montserrat', 'MyriadProSemibold', 'Segoe UI', Arial, sans-serif;
            font-size: 28px;
            font-weight: 600;
            line-height: 1.32;
            text-align: left;
            text-shadow: 0 2px 6px rgba(0, 0, 0, 0.75);
            word-break: break-word;
            overflow: hidden;
        }

        /* Round 2: Vượt Chướng Ngại Vật (Exact PowerPoint 16:9 -> 1920x1080, 1" = 144px, instant Appear - no fade) */
        #view-file-2 {
            background: #13ff08;
        }

        #vs_bg_img {
            position: absolute;
            left: 0;
            top: 0;
            width: 1920px;
            height: 1080px;
            object-fit: fill;
            z-index: 10;
            display: none;
            transition: none;
            pointer-events: none;
        }

        #vs_timer_video {
            position: absolute;
            left: 0;
            top: 0;
            width: 1920px;
            height: 1080px;
            object-fit: fill;
            z-index: 15;
            display: none;
            transition: none;
            pointer-events: none;
        }

        /* Obstacle Hint Image & 5 Puzzle Pieces measured in PPT (1" = 144px): Height 3.25" x Width 5.24", X 1.00" x Y 0.92" */
        #vs_hint_img,
        .vs-piece-img {
            position: absolute;
            left: 144px;
            top: 132.48px;
            width: 754.56px;
            height: 468px;
            object-fit: fill;
            display: none;
            transition: none;
            pointer-events: none;
        }

        #vs_hint_img { z-index: 18; }
        #vs_piece_1 { z-index: 22; }
        #vs_piece_2 { z-index: 23; }
        #vs_piece_3 { z-index: 24; }
        #vs_piece_4 { z-index: 25; }
        #vs_piece_5 { z-index: 26; }

        #vs_rows_container {
            position: absolute;
            inset: 0;
            width: 1920px;
            height: 1080px;
            z-index: 20;
            display: none;
            transition: none;
            pointer-events: none;
        }

        .vs-row-cell {
            position: absolute;
            width: 62.8128px;
            height: 62.8128px;
            display: block;
            object-fit: contain;
            transition: none;
            pointer-events: none;
        }

        #vs_count_img {
            position: absolute;
            left: 1653.4512px;
            top: 236.5776px;
            width: 62.2512px;
            height: 317.8224px;
            object-fit: fill;
            z-index: 30;
            display: none;
            transition: none;
            pointer-events: none;
        }

        /* Question Textbox measured in PPT (1" = 144px): Height 2.43" x Width 5.97", X 1.13" x Y 4.49" */
        #vs_question_box {
            position: absolute;
            left: 162.72px;
            top: 646.56px;
            width: 859.68px;
            height: 349.92px;
            z-index: 40;
            display: none;
            align-items: flex-start;
            justify-content: flex-start;
            padding: 18px 28px;
            transition: none;
            pointer-events: none;
            overflow: hidden;
        }

        #vs_question_text {
            width: 100%;
            color: #ffffff;
            font-family: 'UTM Avo', 'Montserrat', 'MyriadProSemibold', 'Segoe UI', Arial, sans-serif;
            font-size: 28px;
            font-weight: 600;
            line-height: 1.35;
            text-align: left;
            text-shadow: 0 2px 6px rgba(0, 0, 0, 0.75);
            word-break: break-word;
            overflow: hidden;
        }

        /* Intro Media Overlay */
        #intro_video_overlay {
            position: absolute;
            inset: 0;
            width: 1920px;
            height: 1080px;
            background: #000000;
            z-index: 80;
            display: none;
            align-items: center;
            justify-content: center;
        }

        #intro_video_player,
        #intro_image_player {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: none;
        }

        /* Summary Overlay */
        #summary_overlay {
            position: absolute;
            inset: 0;
            width: 1920px;
            height: 1080px;
            background: rgba(6, 20, 48, 0.94);
            z-index: 90;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 80px 160px;
            color: #ffffff;
        }

        .summary-title {
            font-size: 60px;
            font-weight: 600;
            letter-spacing: 2px;
            color: #facc15;
            margin-bottom: 48px;
            text-transform: uppercase;
            text-shadow: 0 4px 16px rgba(0, 0, 0, 0.6);
        }

        .summary-grid {
            width: 100%;
            max-width: 1320px;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .summary-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 26px 42px;
            border-radius: 14px;
            background: linear-gradient(90deg, rgba(16, 55, 115, 0.92), rgba(10, 34, 78, 0.92));
            border: 2px solid rgba(96, 165, 250, 0.45);
            box-shadow: 0 12px 28px rgba(0, 0, 0, 0.35);
        }

        .summary-name {
            font-size: 38px;
            font-weight: 600;
            color: #ffffff;
        }

        .summary-score {
            font-size: 46px;
            font-weight: 600;
            color: #facc15;
            font-variant-numeric: tabular-nums;
        }

        /* Autoplay Audio Unlock Banner (only shown if browser blocks audio playback) */
        #audio_unlock_banner {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 9999;
            background: rgba(15, 23, 42, 0.92);
            color: #facc15;
            border: 2px solid #facc15;
            border-radius: 10px;
            padding: 12px 20px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            display: none;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
        }
    </style>
</head>
<body>
    <button id="audio_unlock_banner" type="button" onclick="unlockProjectorAudio()">
        Nhấn vào đây để bật âm thanh Máy Chiếu
    </button>

    <div id="stage-wrapper">
        <!-- Round 1: Khởi Động -->
        <div id="view-file-1" class="projector-scene active">
            <video id="xp_showques_video" src="/Media/1_showques_4P.mp4" muted playsinline preload="auto"></video>

            <div id="xp_highlight_1" class="xp-highlight"><img src="/Media/1.s1.png" alt="Highlight 1"></div>
            <div id="xp_highlight_2" class="xp-highlight"><img src="/Media/1.s2.png" alt="Highlight 2"></div>
            <div id="xp_highlight_3" class="xp-highlight"><img src="/Media/1.s3.png" alt="Highlight 3"></div>
            <div id="xp_highlight_4" class="xp-highlight"><img src="/Media/1.s4.png" alt="Highlight 4"></div>

            <div id="xp_contestant_box_1" class="xp-contestant-box">
                <span id="xp_ts_name_1" class="xp-ts-name">1. Thí sinh 1</span>
                <span id="xp_ts_score_1" class="xp-ts-score">0</span>
            </div>
            <div id="xp_contestant_box_2" class="xp-contestant-box">
                <span id="xp_ts_name_2" class="xp-ts-name">2. Thí sinh 2</span>
                <span id="xp_ts_score_2" class="xp-ts-score">0</span>
            </div>
            <div id="xp_contestant_box_3" class="xp-contestant-box">
                <span id="xp_ts_name_3" class="xp-ts-name">3. Thí sinh 3</span>
                <span id="xp_ts_score_3" class="xp-ts-score">0</span>
            </div>
            <div id="xp_contestant_box_4" class="xp-contestant-box">
                <span id="xp_ts_name_4" class="xp-ts-name">4. Thí sinh 4</span>
                <span id="xp_ts_score_4" class="xp-ts-score">0</span>
            </div>

            <div id="xp_question_box">
                <div id="xp_question_text"></div>
            </div>
        </div>

        <!-- Round 2: Vượt Chướng Ngại Vật -->
        <div id="view-file-2" class="projector-scene">
            <img id="vs_bg_img" src="/Media/2.bg.png" alt="Vượt Chướng Ngại Vật Background">
            <video id="vs_timer_video" src="/Media/2_15s.mp4" muted playsinline preload="auto"></video>
            <img id="vs_hint_img" alt="Ảnh gợi ý Chướng Ngại Vật">
            <img id="vs_piece_1" class="vs-piece-img" src="/Media/Manh1.png" alt="Mảnh ghép 1">
            <img id="vs_piece_2" class="vs-piece-img" src="/Media/Manh2.png" alt="Mảnh ghép 2">
            <img id="vs_piece_3" class="vs-piece-img" src="/Media/Manh3.png" alt="Mảnh ghép 3">
            <img id="vs_piece_4" class="vs-piece-img" src="/Media/Manh4.png" alt="Mảnh ghép 4">
            <img id="vs_piece_5" class="vs-piece-img" src="/Media/Manh5.png" alt="Mảnh ghép 5 (Trung tâm)">
            <div id="vs_rows_container"></div>
            <img id="vs_count_img" src="/Media/2.count.png" alt="Số hàng ngang">
            <div id="vs_question_box">
                <div id="vs_question_text"></div>
            </div>
        </div>

        <!-- Intro Video / Image Overlay -->
        <div id="intro_video_overlay">
            <video id="intro_video_player" playsinline preload="auto"></video>
            <img id="intro_image_player" alt="Intro Media">
        </div>

        <!-- Summary Scoreboard Overlay -->
        <div id="summary_overlay">
            <div class="summary-title">Tổng Kết Điểm</div>
            <div class="summary-grid">
                <div class="summary-row">
                    <span id="summary_ts1" class="summary-name">1. Thí sinh 1</span>
                    <span id="summary_d1" class="summary-score">0</span>
                </div>
                <div class="summary-row">
                    <span id="summary_ts2" class="summary-name">2. Thí sinh 2</span>
                    <span id="summary_d2" class="summary-score">0</span>
                </div>
                <div class="summary-row">
                    <span id="summary_ts3" class="summary-name">3. Thí sinh 3</span>
                    <span id="summary_d3" class="summary-score">0</span>
                </div>
                <div class="summary-row">
                    <span id="summary_ts4" class="summary-name">4. Thí sinh 4</span>
                    <span id="summary_d4" class="summary-score">0</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        window.CURRENT_ROLE = 'projector';

        // Viewport scaling (1920x1080 aspect-fit)
        function scaleStage() {
            const stage = document.getElementById('stage-wrapper');
            if (!stage) return;
            const scale = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
            stage.style.transform = `scale(${scale})`;
        }
        window.addEventListener('resize', scaleStage);
        window.addEventListener('DOMContentLoaded', scaleStage);
        scaleStage();

        // Audio Settings
        const audioSettings = {
            enabled: true,
            volume: 1.0
        };

        try {
            const savedAudio = localStorage.getItem('ddvq_audio_settings');
            if (savedAudio) {
                const parsed = JSON.parse(savedAudio);
                if (typeof parsed.projectorEnabled === 'boolean') audioSettings.enabled = parsed.projectorEnabled;
                if (typeof parsed.projectorVolume === 'number') audioSettings.volume = Math.max(0, Math.min(1, parsed.projectorVolume / 100));
            }
        } catch (e) {}

        // Preload Round 1 & Round 2 SFX
        const SFX_PATHS = {
            startRound: '/SFX/1_StartRound.mp3',
            pStart: '/SFX/1_PStart.mp3',
            showQues: '/SFX/1_StartStartQuestionShow.mp3',
            buzz: '/SFX/1_buzz.mp3',
            loop1: '/SFX/1_thinking_O10_loop_1.mp3',
            loop2: '/SFX/1_thinking_O10_loop_2.mp3',
            loop3: '/SFX/1_thinking_O10_loop_3.mp3',
            loop4: '/SFX/1_thinking_O10_loop_4.mp3',
            finish: '/SFX/1_Finish.mp3',
            right: '/SFX/1_Right.mp3',
            wrong: '/SFX/1_Wrong.mp3',
            r2StartRound: '/SFX/2_StartRound.mp3',
            r2RowShow: '/SFX/2_RowShow.mp3',
            r2RowChose: '/SFX/2_RowChose.mp3',
            r2RowQues: '/SFX/2_RowQues.mp3',
            r2OnTime: '/SFX/2_OnTime.mp3',
            r2ShowPiece: '/SFX/2_ShowPiece.mp3'
        };

        // Preload Round 2 cell & puzzle piece images for instant swap (Appear, no flicker)
        [
            '/Media/2.bg.png',
            '/Media/2.count.png',
            '/Media/h1.png',
            '/Media/h2.png',
            '/Media/Manh1.png',
            '/Media/Manh2.png',
            '/Media/Manh3.png',
            '/Media/Manh4.png',
            '/Media/Manh5.png'
        ].forEach(src => {
            const img = new Image();
            img.src = src;
        });

        const sfxBank = {};
        Object.keys(SFX_PATHS).forEach(key => {
            const a = new Audio(SFX_PATHS[key]);
            a.preload = 'auto';
            if (key === 'loop1' || key === 'loop2' || key === 'loop3') {
                a.loop = true;
            }
            sfxBank[key] = a;
        });

        let pendingBlockedAudio = null;

        function unlockProjectorAudio() {
            const banner = document.getElementById('audio_unlock_banner');
            if (banner) banner.style.display = 'none';
            if (pendingBlockedAudio) {
                const { key, loop } = pendingBlockedAudio;
                pendingBlockedAudio = null;
                playSfx(key, { loop });
            } else {
                // Silent touch unlock across bank
                Object.values(sfxBank).forEach(a => {
                    try {
                        if (a.paused) {
                            a.load();
                        }
                    } catch (e) {}
                });
            }
        }
        window.unlockProjectorAudio = unlockProjectorAudio;

        document.addEventListener('pointerdown', () => {
            if (pendingBlockedAudio) unlockProjectorAudio();
        }, { passive: true });

        function applyVolumeAll() {
            const vol = audioSettings.enabled ? audioSettings.volume : 0;
            Object.values(sfxBank).forEach(a => {
                a.volume = vol;
            });
            const introVid = document.getElementById('intro_video_player');
            if (introVid) introVid.volume = vol;
        }

        function stopAudioItem(audio) {
            if (!audio) return;
            try {
                audio.pause();
                audio.currentTime = 0;
            } catch (e) {}
        }

        function playSfx(key, options = {}) {
            const audio = sfxBank[key];
            if (!audio) return;
            if (!audioSettings.enabled) return;

            try {
                if (typeof options.loop === 'boolean') {
                    audio.loop = options.loop;
                }
                audio.volume = audioSettings.volume;
                if (audio.readyState > 0 && audio.currentTime !== 0) {
                    audio.currentTime = 0;
                }
                const p = audio.play();
                if (p && typeof p.catch === 'function') {
                    p.catch(err => {
                        if (err && err.name === 'NotAllowedError') {
                            pendingBlockedAudio = { key, loop: !!audio.loop };
                            const banner = document.getElementById('audio_unlock_banner');
                            if (banner) banner.style.display = 'block';
                        }
                    });
                }
            } catch (e) {}
        }

        function stopThinkingLoops() {
            stopAudioItem(sfxBank.loop1);
            stopAudioItem(sfxBank.loop2);
            stopAudioItem(sfxBank.loop3);
            stopAudioItem(sfxBank.loop4);
            activeThinkingLoop = 0;
        }

        function stopAllRound2Audio() {
            stopAudioItem(sfxBank.r2StartRound);
            stopAudioItem(sfxBank.r2RowShow);
            stopAudioItem(sfxBank.r2RowChose);
            stopAudioItem(sfxBank.r2RowQues);
            stopAudioItem(sfxBank.r2OnTime);
            stopAudioItem(sfxBank.r2ShowPiece);
        }

        function stopAllRound1Audio() {
            stopThinkingLoops();
            stopAudioItem(sfxBank.startRound);
            stopAudioItem(sfxBank.pStart);
            stopAudioItem(sfxBank.showQues);
            stopAudioItem(sfxBank.buzz);
            stopAudioItem(sfxBank.finish);
            stopAudioItem(sfxBank.right);
            stopAudioItem(sfxBank.wrong);
            pendingBlockedAudio = null;
        }

        function switchProjectorScene(sceneNum) {
            document.querySelectorAll('.projector-scene').forEach(el => {
                el.classList.remove('active');
            });
            const target = document.getElementById(`view-file-${sceneNum}`);
            if (target) {
                target.classList.add('active');
            }
        }

        // Round 2 (Vượt Chướng Ngại Vật) Exact PPT Coordinates (1" = 144px on 1920x1080)
        const PPT_PPI = 144;
        const R2_COL_X_IN = [
            6.5277, 7.0151, 7.5025, 7.9899, 8.4773,
            8.9647, 9.4521, 9.9395, 10.4269, 10.9143
        ];
        const R2_ROW_Y_IN = [1.6429, 2.2292, 2.8156, 3.4020];
        let r2VuotSongData = null;
        let isRound2RowsShown = false;
        let r2SelectedRow = null;
        let r2OpenedPieces = { 1: false, 2: false, 3: false, 4: false, 5: false };

        function syncRound2Data(vsData) {
            if (!vsData || typeof vsData !== 'object' || Array.isArray(vsData)) return;
            r2VuotSongData = vsData;
            updateRound2HintImage();
        }

        function updateRound2HintImage() {
            const hintImg = document.getElementById('vs_hint_img');
            if (!hintImg) return;
            const hintUrl = (r2VuotSongData && r2VuotSongData.hintImage ? String(r2VuotSongData.hintImage).trim() : '');
            if (hintUrl) {
                if (hintImg.getAttribute('src') !== hintUrl) {
                    hintImg.setAttribute('src', hintUrl);
                }
                hintImg.style.display = isRound2RowsShown ? 'block' : 'none';
            } else {
                hintImg.style.display = 'none';
                hintImg.removeAttribute('src');
            }
        }

        function updateRound2PiecesVisibility() {

            cells.forEach(img => {

                    img.setAttribute('src', targetSrc);

        function renderRound2Rows(vsData) {
            const container = document.getElementById('vs_rows_container');
            if (!container) return;
            const src = vsData || r2VuotSongData || {};

            const rowCounts = [];
            let hasAnyAnswer = false;
            for (let r = 1; r <= 4; r++) {
                const rawAns = (src[`h${r}`]?.a || '').toString().replace(/\s+/g, '');
                const len = Math.min(rawAns.length, 10);
                if (len > 0) hasAnyAnswer = true;
                rowCounts.push(len);
            }

            const frag = document.createDocumentFragment();
            for (let rowIdx = 0; rowIdx < 4; rowIdx++) {
                const rowNum = rowIdx + 1;
                const count = hasAnyAnswer ? rowCounts[rowIdx] : 10;
                if (count <= 0) continue;
                const startCol = 10 - count;
                const topPx = R2_ROW_Y_IN[rowIdx] * PPT_PPI;
                const cellSrc = getRound2CellSrc(rowNum);
                for (let colIdx = startCol; colIdx < 10; colIdx++) {
                    const img = document.createElement('img');
                    img.className = 'vs-row-cell';
                    img.dataset.row = String(rowNum);
                    img.src = cellSrc;
                    img.alt = `Ô ${rowIdx * 10 + colIdx + 1}`;
                    img.style.left = `${(R2_COL_X_IN[colIdx] * PPT_PPI).toFixed(4)}px`;
                    img.style.top = `${topPx.toFixed(4)}px`;
                    frag.appendChild(img);

        function computeTargetThinkingLoop(questionIndex, totalQuestions) {
            const q = Math.max(1, parseInt(questionIndex, 10) || 1);
            const total = Math.max(1, parseInt(totalQuestions, 10) || 6);

            if (total <= 6) {
                if (q >= 6) return 4;
                if (q >= 5) return 3;
                if (q >= 3) return 2;
                return 1;
            }

            if (total === 12) {
                if (q >= 12) return 4;
                if (q === 11) return 3;
                if (q >= 6) return 2;
                return 1;
            }

            const loop4At = total;
            const loop3At = Math.max(2, total - 1);
            const loop2At = Math.max(2, Math.floor((total - 2) / 2) + 1);

            if (q >= loop4At) return 4;
            if (q >= loop3At) return 3;
            if (q >= loop2At) return 2;
            return 1;
        }

        function playThinkingLoopForQuestion(questionIndex, totalQuestions, forceRestart = false) {
            const targetLoop = computeTargetThinkingLoop(questionIndex, totalQuestions);
            if (!forceRestart && activeThinkingLoop === targetLoop) {
                return;
            }
            stopThinkingLoops();
            activeThinkingLoop = targetLoop;
            const loopKey = `loop${targetLoop}`;
            const shouldLoop = targetLoop < 4;
            playSfx(loopKey, { loop: shouldLoop });
        }

        function handleShowGraphicCauHoi(data) {

            // Hide previous highlight/meta/question box before animation plays

                if (activeTurnIndex >= 1 && activeTurnIndex <= 4) {

        function handleHienCauHoi(data) {

            const qBox = document.getElementById('xp_question_box');

            const defaultTotal = activeTurnIndex === 5 ? 12 : 6;

        // Message Deduplication across WS / BroadcastChannel / Storage / postMessage
        const seenActionKeys = new Map();
        function isDuplicateMessage(data) {
            if (!data || !data.type) return true;
            const key = data._msgId || data.id || `${data.type}_${data.timestamp || data._timestamp || ''}`;
            if (!key) return false;
            const now = Date.now();
            if (seenActionKeys.size > 200) {
                for (const [k, t] of seenActionKeys.entries()) {
                    if (now - t > 10000) seenActionKeys.delete(k);
                }
            }
            if (seenActionKeys.has(key)) return true;
            seenActionKeys.set(key, now);
            return false;
        }

        function handleProjectorMessage(data) {
            if (!data || typeof data !== 'object') return;
            if (isDuplicateMessage(data)) return;

            const type = data.type;

            switch (type) {
                case 'START_ROUND_CLEAN': {
                    handleIntroStop();
                    const summaryEl = document.getElementById('summary_overlay');
                    if (summaryEl) summaryEl.style.display = 'none';
                    if (data.contestants) syncContestantsData(data.contestants);
                    if (data.vuotSong) syncRound2Data(data.vuotSong);

                    if (data.roundIndex === 1 || data.round === 'XUAT_PHAT' || data.activeRound === 'XUAT_PHAT') {
                        switchProjectorScene(1);
                        activeTurnIndex = 0;
                        xpFastestWinner = 0;
                        xpBuzzerOpen = false;
                        hideAllRound1Graphics();
                        hideAllRound2Graphics();
                        stopAllRound1Audio();
                        stopAllRound2Audio();
                        playSfx('startRound', { loop: false });
                    } else if (data.roundIndex === 3 || data.round === 'VUOT_SONG' || data.activeRound === 'VUOT_SONG') {
                        switchProjectorScene(2);
                        activeTurnIndex = 0;
                        xpFastestWinner = 0;
                        xpBuzzerOpen = false;
                        hideAllRound1Graphics();
                        hideAllRound2Graphics();
                        stopAllRound1Audio();
                        stopAllRound2Audio();
                        playSfx('r2StartRound', { loop: false });
                    }
                    break;
                }

                case 'VUOT_SONG_SHOW_ROWS': {
                    handleIntroStop();
                    const summaryEl = document.getElementById('summary_overlay');
                    if (summaryEl) summaryEl.style.display = 'none';
                    if (data.contestants) syncContestantsData(data.contestants);
                    switchProjectorScene(2);
                    stopAllRound1Audio();
                    stopAudioItem(sfxBank.r2StartRound);
                    showRound2Rows(data);
                    playSfx('r2RowShow', { loop: false });
                    break;
                }

                case 'VUOT_SONG_SELECT_ROW': {
                    const incomingVS = data.vuotSong || (data.gameData && data.gameData.vuotSong);
                    if (incomingVS) syncRound2Data(incomingVS);
                    const rowNum = parseInt(data.row, 10);
                    r2SelectedRow = (rowNum >= 1 && rowNum <= 4) ? rowNum : null;
                    stopRound2TimerVideo();
                    hideRound2QuestionBox();
                    if (isRound2RowsShown) {
                        updateRound2RowGraphics();
                    }
                    if (rowNum >= 1 && rowNum <= 4) {
                        stopAudioItem(sfxBank.r2RowShow);
                        playSfx('r2RowChose', { loop: false });
                    }
                    break;
                }

                case 'VUOT_SONG_SHOW_QUESTION': {
                    handleRound2ShowQuestion(data);
                    break;
                }

                case 'VUOT_SONG_START_TIMER': {
                    handleRound2StartTimer(data);
                    break;
                }

                case 'VUOT_SONG_RETURN_GRID': {
                    stopRound2TimerVideo();
                    hideRound2QuestionBox();
                    stopAudioItem(sfxBank.r2RowQues);
                    stopAudioItem(sfxBank.r2OnTime);
                    break;
                }

                case 'VUOT_SONG_OPEN_PIECE': {
                    handleRound2OpenPiece(data);
                    break;
                }

                case 'VUOT_SONG_SYNC_GRID': {
                    if (data.vuotSong) {
                        syncRound2Data(data.vuotSong);
                        if (isRound2RowsShown) {
                            renderRound2Rows(r2VuotSongData);
                        }
                    }
                    break;
                }

                case 'VUOT_SONG_RESET': {
                    if (data.contestants) syncContestantsData(data.contestants);
                    if (data.vuotSong) syncRound2Data(data.vuotSong);
                    hideAllRound2Graphics();
                    if (!data.keepRoundStartSound) {
                        stopAllRound2Audio();
                    }
                    break;
                }

                case 'XUAT_PHAT_RESET': {
                    if (data.contestants) syncContestantsData(data.contestants);
                    activeTurnIndex = parseInt(data.turnIndex, 10) || 0;
                    xpFastestWinner = 0;
                    xpBuzzerOpen = false;
                    hideAllRound1Graphics();
                    if (!data.keepRoundStartSound) {
                        stopAllRound1Audio();
                    }
                    break;
                }

                case 'XUAT_PHAT_PSTART': {
                    if (data.contestants) syncContestantsData(data.contestants);
                    if (data.turnIndex) {
                        activeTurnIndex = parseInt(data.turnIndex, 10) || activeTurnIndex;
                    }
                    stopAudioItem(sfxBank.startRound);
                    stopThinkingLoops();
                    playSfx('pStart', { loop: false });
                    break;
                }

                case 'XUAT_PHAT_SELECT_CONTESTANT': {
                    if (data.contestants) syncContestantsData(data.contestants);
                    if (data.turnIndex) {
                        activeTurnIndex = parseInt(data.turnIndex, 10) || 0;
                    }
                    xpFastestWinner = 0;
                    xpBuzzerOpen = false;
                    if (isRound1MetaRevealed) {
                        updateActiveHighlight(activeTurnIndex);
                    }
                    break;
                }

                case 'XUAT_PHAT_SELECT_CHUNG': {
                    if (data.contestants) syncContestantsData(data.contestants);
                    activeTurnIndex = 5;
                    xpFastestWinner = 0;
                    xpBuzzerOpen = false;
                    if (isRound1MetaRevealed) {
                        updateActiveHighlight(0);
                    }
                    break;
                }

                case 'XUAT_PHAT_SHOW_GRAPHIC_CAU_HOI': {
                    handleIntroStop();
                    const summaryEl = document.getElementById('summary_overlay');
                    if (summaryEl) summaryEl.style.display = 'none';
                    handleShowGraphicCauHoi(data);
                    break;
                }

                case 'XUAT_PHAT_HIEN_CAU_HOI':
                case 'XUAT_PHAT_BAT_DAU_CAU_HOI': {
                    handleIntroStop();
                    const summaryEl = document.getElementById('summary_overlay');
                    if (summaryEl) summaryEl.style.display = 'none';
                    handleHienCauHoi(data);
                    break;
                }

                case 'XUAT_PHAT_NEXT_QUESTION': {
                    handleNextQuestion(data);
                    break;
                }

                case 'PLAYER_RING_BELL':
                case 'RING_BELL': {
                    const r = (data.round || '').toString().toUpperCase();
                    if (r === 'KD' || r === 'XUAT_PHAT' || r === 'KHOI_DONG' || r === 'XP' || (!r && activeTurnIndex === 5)) {
                        const winner = data.winnerId || data.contestantId || data.contestantIndex;
                        handleXuatPhatFastestBuzz(winner, false);
                    }
                    break;
                }

                case 'XUAT_PHAT_SHOW_FASTEST_HL': {
                    const winner = data.contestantIndex || data.whoBuzzed || data.contestantId || data.winnerId;
                    handleXuatPhatFastestBuzz(winner, true);
                    break;
                }

                case 'UNLOCK_BELLS': {
                    if (activeTurnIndex === 5 || parseInt(data.turnIndex, 10) === 5) {
                        activeTurnIndex = 5;
                        xpFastestWinner = 0;
                        xpBuzzerOpen = true;
                        updateActiveHighlight(0);
                    }
                    break;
                }

                case 'LOCK_BELLS': {
                    if (activeTurnIndex === 5) {
                        xpBuzzerOpen = false;
                        const winner = data.contestantIndex || data.whoBuzzed || data.contestantId;
                        if (winner && xpFastestWinner === 0) {
                            handleXuatPhatFastestBuzz(winner, true);
                        }
                    }
                    break;
                }

                case 'XUAT_PHAT_RIGHT': {
                    if (data.contestants) {
                        syncContestantsData(data.contestants);
                    } else {
                        const targetTs = parseInt(data.targetContestantId || data.contestantId || data.turnIndex, 10);
                        if (targetTs >= 1 && targetTs <= 4 && data.score !== undefined && r1Contestants[targetTs - 1]) {
                            r1Contestants[targetTs - 1].score = Number(data.score) || 0;
                            renderContestantsUI();
                        }
                    }
                    if (activeTurnIndex === 5) xpBuzzerOpen = false;
                    playSfx('right', { loop: false });
                    break;
                }

                case 'XUAT_PHAT_WRONG': {
                    if (data.contestants) {
                        syncContestantsData(data.contestants);
                    } else {
                        const targetTs = parseInt(data.targetContestantId || data.contestantId || data.turnIndex, 10);
                        if (targetTs >= 1 && targetTs <= 4 && data.score !== undefined && r1Contestants[targetTs - 1]) {
                            r1Contestants[targetTs - 1].score = Number(data.score) || 0;
                            renderContestantsUI();
                        }
                    }
                    if (activeTurnIndex === 5) xpBuzzerOpen = false;
                    playSfx('wrong', { loop: false });
                    break;
                }

                case 'XUAT_PHAT_FINISH': {
                    xpFastestWinner = 0;
                    xpBuzzerOpen = false;
                    hideAllRound1Graphics();
                    stopThinkingLoops();
                    stopAudioItem(sfxBank.showQues);
                    stopAudioItem(sfxBank.pStart);
                    stopAudioItem(sfxBank.startRound);
                    stopAudioItem(sfxBank.buzz);
                    playSfx('finish', { loop: false });
                    break;
                }

                case 'XUAT_PHAT_STOP_SOUND':
                case 'STOP_SOUND': {
                    stopAllRound1Audio();
                    stopAllRound2Audio();
                    break;
                }

                case 'UPDATE_SCORES':
                case 'UPDATE_CONTESTANTS':
                case 'SYNC_GAME_DATA':
                case 'FULL_STATE_SYNC': {
                    if (data.contestants) syncContestantsData(data.contestants);
                    else if (data.gameData && data.gameData.contestants) syncContestantsData(data.gameData.contestants);

                    const incomingVS = data.vuotSong || (data.gameData && data.gameData.vuotSong);
                    if (incomingVS) {
                        syncRound2Data(incomingVS);
                    }
                    if (data.vuotSongRow !== undefined) {
                        const rowNum = parseInt(data.vuotSongRow, 10);
                        r2SelectedRow = (rowNum >= 1 && rowNum <= 4) ? rowNum : null;
                    }
                    if (isRound2RowsShown && (incomingVS || data.vuotSongRow !== undefined)) {
                        renderRound2Rows(r2VuotSongData);
                    }
                    break;
                }

                case 'PLAY_INTRO_VIDEO': {
                    handleIntroPlay(data);
                    break;
                }

                case 'STOP_INTRO_VIDEO': {
                    handleIntroStop();
                    break;
                }

                case 'TOGGLE_SUMMARY': {
                    handleToggleSummary(data);
                    break;
                }

                case 'UPDATE_AUDIO_SETTINGS': {
                    if (data.audioSettings) {
                        audioSettings.enabled = data.audioSettings.projectorEnabled !== false;
                        audioSettings.volume = typeof data.audioSettings.projectorVolume === 'number'
                            ? Math.max(0, Math.min(1, data.audioSettings.projectorVolume / 100))
                            : 1.0;
                        applyVolumeAll();
                    }
                    break;
                }

                case 'RESET_ALL_DATA': {
                    activeTurnIndex = 0;
                    switchProjectorScene(1);
                    hideAllRound1Graphics();
                    hideAllRound2Graphics();
                    stopAllRound1Audio();
                    stopAllRound2Audio();
                    r1Contestants = [
                        { name: 'Thí sinh 1', score: 0 },
                        { name: 'Thí sinh 2', score: 0 },
                        { name: 'Thí sinh 3', score: 0 },
                        { name: 'Thí sinh 4', score: 0 }
                    ];
                    renderContestantsUI();
                    break;
                }

                case 'RELOAD_CLIENT': {
                    if (data.target === 'all' || data.target === 'projector' || data.role === 'projector') {
                        window.location.reload();
                    }
                    break;
                }
            }
        }
        window.handleProjectorMessage = handleProjectorMessage;

        // Multi-channel listeners (BroadcastChannel, localStorage, window.message)
        let projBroadcastChannel = null;
        try {
            projBroadcastChannel = new BroadcastChannel('ddvq_game_channel');
            projBroadcastChannel.onmessage = (event) => {
                if (event && event.data) {
                    handleProjectorMessage(event.data);
                }
            };
        } catch (e) {}

        window.addEventListener('storage', (event) => {
            if (!event) return;
            if (event.key === 'ddvq_latest_action' && event.newValue) {
                try {
                    const parsed = JSON.parse(event.newValue);
                    handleProjectorMessage(parsed);
                } catch (e) {}
            } else if (event.key === 'duong_den_vinh_quang_data' && event.newValue) {
                try {
                    const parsed = JSON.parse(event.newValue);
                    if (parsed && parsed.contestants) syncContestantsData(parsed.contestants);
                    if (parsed && parsed.vuotSong) {
                        syncRound2Data(parsed.vuotSong);
                        if (isRound2RowsShown) renderRound2Rows(r2VuotSongData);
                    }
                } catch (e) {}
            }
        });

        window.addEventListener('message', (event) => {
            if (event && event.data && typeof event.data === 'object') {
                handleProjectorMessage(event.data);
            }
        });

        // Initial State Hydration from localStorage and /api/state
        function hydrateInitialProjectorState() {
            try {
                const rawGameData = localStorage.getItem('duong_den_vinh_quang_data');
                if (rawGameData) {
                    const parsed = JSON.parse(rawGameData);
                    if (parsed && parsed.contestants) syncContestantsData(parsed.contestants);
                    if (parsed && parsed.vuotSong) syncRound2Data(parsed.vuotSong);
                }
            } catch (e) {}

            if (typeof hasLocalServerBackend === 'function' && hasLocalServerBackend()) {
                const apiUrl = typeof getApiUrl === 'function' ? getApiUrl('/api/state') : '/api/state';
                fetch(apiUrl)
                    .then(res => res.json())
                    .then(state => {
                        if (!state) return;
                        if (state.contestants) syncContestantsData(state.contestants);
                        else if (state.gameData && state.gameData.contestants) syncContestantsData(state.gameData.contestants);

                        if (state.vuotSongRow !== undefined) {
                            const rowNum = parseInt(state.vuotSongRow, 10);
                            r2SelectedRow = (rowNum >= 1 && rowNum <= 4) ? rowNum : null;
                        }
                        const vs = state.vuotSong || (state.gameData && state.gameData.vuotSong);
                        if (vs) {
                            syncRound2Data(vs);
                            if (isRound2RowsShown) renderRound2Rows(r2VuotSongData);
                        }
                    })
                    .catch(() => {});
            }
        }

        // Presence / Heartbeat so Controller sees Projector Online
        function sendProjectorHeartbeat(isReady = false) {
            const payload = {
                type: isReady ? 'PROJECTOR_READY' : 'CLIENT_HEARTBEAT',
                role: 'projector',
                name: 'Máy Chiếu',
                timestamp: Date.now()
            };
            if (typeof sendSupabaseAction === 'function') {
                try { sendSupabaseAction(payload); } catch (e) {}
            }
            if (projBroadcastChannel) {
                try { projBroadcastChannel.postMessage(payload); } catch (e) {}
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            renderContestantsUI();
            applyVolumeAll();
            hydrateInitialProjectorState();
            setTimeout(() => sendProjectorHeartbeat(true), 250);
            setInterval(() => sendProjectorHeartbeat(false), 5000);
        });
    </script>
</body>
</html>
